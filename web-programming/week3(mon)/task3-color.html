<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Swatches</title>

    <style>
        .swatch-card {
            display: flex;
            gap: 12px;
        }

        .swatch {
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
        }

        .purple {
            background-color: #7c3aed;
        }

        .blue {
            background-color: #0369a1;
        }

        .green {
            background-color: #16a34a;
        }

        .orange {
            background-color: #ea580c;
        }

        .pink {
            background-color: #db2777;
        }
    </style>
</head>

<body>

    <div class="swatch-card">
        <div class="swatch purple">#7c3aed</div>
        <div class="swatch blue">#0369a1</div>
        <div class="swatch green">#16a34a</div>
        <div class="swatch orange">#ea580c</div>
        <div class="swatch pink">#db2777</div>
    </div>

</body>
</html>
