<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figures</title>
</head>
<body>
  <figure>
    <img src="https://picsum.photos/400/250?random=10"
         alt="A randomly selected scenic photograph"

  </figure>

  <p>
    Today is <time datetime="2026-09-05">September 5, 2026</time>.
  </p>

  <figure>
    <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;My Page&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;</code></pre>
    <figcaption>Figure 2: Basic HTML skeleton.</figcaption>
  </figure>
</body>
</html>
