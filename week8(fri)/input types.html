<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 03 | Input Types</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px 16px; max-width: 540px; margin: 0 auto; color: #1e293b; background: #f4f6fb; }
    main { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { color: #1a56db; margin-top: 0; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    input[type="color"] { height: 42px; padding: 2px; cursor: pointer; }
    .back { display: inline-block; margin-top: 24px; color: #1a56db; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Topic 03: HTML5 Input Types</h1>
    <p>Choosing semantic input types automatically optimizes mobile virtual keyboards and provides built-in browser parsing.</p>

    <div class="field">
      <label for="t-text">type="text"</label>
      <input type="text" id="t-text" placeholder="Standard text">
    </div>

    <div class="field">
      <label for="t-email">type="email" (Triggers '@' keyboard on mobile)</label>
      <input type="email" id="t-email" placeholder="student@gachon.ac.kr">
    </div>

    <div class="field">
      <label for="t-pwd">type="password" (Masks characters)</label>
      <input type="password" id="t-pwd" placeholder="••••••••">
    </div>

    <div class="field">
      <label for="t-date">type="date" (Native date picker)</label>
      <input type="date" id="t-date">
    </div>

    <div class="field">
      <label for="t-color">type="color" (System color picker)</label>
      <input type="color" id="t-color" value="#1a56db">
    </div>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>
