<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 02 | The Form Element</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px 16px; max-width: 540px; margin: 0 auto; color: #1e293b; background: #f4f6fb; }
    main { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { color: #1a56db; margin-top: 0; }
    pre { background: #0f172a; color: #38bdf8; padding: 14px; border-radius: 8px; font-size: .85rem; overflow-x: auto; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; padding: 11px; background: #1a56db; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .back { display: inline-block; margin-top: 24px; color: #1a56db; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Topic 02: The &lt;form&gt; Element</h1>
    <p>The <code>&lt;form&gt;</code> element defines the form boundary and specifies submission rules using two critical attributes:</p>

    <pre><code>&lt;!-- action: destination URL | method: GET or POST --&gt;
&lt;form action="/submit" method="POST"&gt;
  &lt;input name="username"&gt;
&lt;/form&gt;</code></pre>

    <!-- GET vs POST demo -->
    <form action="topic_02_the_form_element.html" method="GET">
      <div class="field">
        <label for="user">Username (Notice how GET appends this to the URL)</label>
        <input type="text" id="user" name="username" placeholder="e.g. gachon_student">
      </div>
      <button type="submit">Submit (GET Request)</button>
    </form>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>
