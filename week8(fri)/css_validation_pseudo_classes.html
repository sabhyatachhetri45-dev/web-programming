<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 07 | CSS Validation Pseudo-Classes</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px 16px; max-width: 540px; margin: 0 auto; color: #1e293b; background: #f4f6fb; }
    main { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { color: #1a56db; margin-top: 0; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 4px; }

    input {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem;
      outline: none; transition: all 0.2s;
    }

    /* Green when input is valid and user has typed */
    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }

    /* Red when input is invalid and user has typed */
    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    /* Focus ring */
    input:focus {
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.25);
    }

    .back { display: inline-block; margin-top: 24px; color: #1a56db; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Topic 07: CSS Pseudo-Classes</h1>
    <p>Using <code>:valid</code>, <code>:invalid</code>, and <code>:not(:placeholder-shown)</code> provides immediate visual feedback purely with CSS.</p>

    <form>
      <div class="field">
        <label for="v-email">Email (try typing a partial address vs complete)</label>
        <input type="email" id="v-email" required placeholder=" ">
      </div>

      <div class="field">
        <label for="v-pwd">Password (must be 8+ characters)</label>
        <input type="password" id="v-pwd" required minlength="8" placeholder=" ">
      </div>
    </form>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>
