<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 06 | Grouping Fields</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px 16px; max-width: 540px; margin: 0 auto; color: #1e293b; background: #f4f6fb; }
    main { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { color: #1a56db; margin-top: 0; }
    fieldset {
      border: 2px solid #c8d4f0;
      border-radius: 10px;
      padding: 12px 18px 18px;
      margin-bottom: 20px;
    }
    legend {
      font-weight: 700;
      color: #1a56db;
      padding: 0 8px;
    }
    label { display: block; font-weight: 600; font-size: .88rem; margin: 10px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid #cbd5e1; border-radius: 8px; }
    .back { display: inline-block; margin-top: 24px; color: #1a56db; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Topic 06: Fieldset & Legend</h1>
    <p>The <code>&lt;fieldset&gt;</code> tag organizes related inputs into logical sections, and <code>&lt;legend&gt;</code> provides a caption read by assistive tech.</p>

    <form>
      <!-- Group 1 -->
      <fieldset>
        <legend>Personal Information</legend>
        <label for="fname">Full Name</label>
        <input type="text" id="fname" placeholder="Hong Gildong">

        <label for="dept">Academic Major</label>
        <select id="dept">
          <option>Computer Science</option>
          <option>Software Engineering</option>
          <option>Artificial Intelligence</option>
        </select>
      </fieldset>

      <!-- Group 2 -->
      <fieldset>
        <legend>Contact Information</legend>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@gachon.ac.kr">
      </fieldset>
    </form>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>
