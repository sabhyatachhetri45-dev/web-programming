<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabhyata Chhetri – Profile Card</title>
<style>
@font-face{font-family:"Gaegu";src:url("../assets/fonts/gaegu-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url("../assets/fonts/gowun-dodum.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Nanum Pen Script";src:url("../assets/fonts/nanum-pen-script.woff2") format("woff2");font-display:swap}

/* A 문방구 toy on a pegboard: the profile card is the cardboard backing of a
   blister pack, the mascot is the toy sealed under the plastic bubble.
   "Go dark" turns the shop lights off and the toy glows in the dark.
   The JavaScript is unchanged: it still toggles .dark on #card. */
*,*::before,*::after{box-sizing:border-box}
body{
  --wall:#c9d3c6;--hole:#93a08f;--card:#fffdf8;--band:#ff8fab;--ink:#2b2140;--soft:#5f5670;--line:#2b2140;
  --pink:#ff8fb1;--mint:#7fdcc0;--sun:#ffd35c;--lilac:#c3b3ff;--sheet:#efe9fb;--glow:transparent;
  margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:5.5rem 24px 6rem;overflow-x:hidden;
  font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle,var(--hole) 3px,transparent 3.5px) 0 0/30px 30px,var(--wall);
  transition:background-color .6s}
/* Shop lights off: the pegboard goes dark and the toy glows. */
body:has(.card.dark){
  --wall:#1e1b26;--hole:#121018;--card:#2a2635;--band:#3b3350;--ink:#dff7ea;--soft:#a9c9b8;--line:#0f0d16;
  --pink:#9ef0c0;--mint:#5fb894;--sun:#d4c070;--lilac:#8c7fcf;--sheet:#332e42;--glow:rgb(158 240 192 / .55)}

/* The metal peg the pack hangs from. */
.peg{position:relative;z-index:1;width:min(370px,100%);min-width:0}
.peg::before{content:"";position:absolute;top:-4.4rem;left:50%;width:.5rem;height:5.6rem;margin-left:-.25rem;z-index:2;
  border-radius:.3rem;background:linear-gradient(90deg,#8d939a,#e6e9ec 45%,#9aa1a8);
  box-shadow:2px 3px 4px rgb(0 0 0 / .3)}
.peg::after{content:"";position:absolute;top:-4.8rem;left:50%;width:1.6rem;height:1rem;margin-left:-.8rem;
  border-radius:50%;background:radial-gradient(circle at 40% 35%,#eef0f2,#9aa1a8 70%);box-shadow:0 2px 3px rgb(0 0 0 / .35)}

/* card = the cardboard backing card */
.card{position:relative;width:100%;padding:76px 26px 0;overflow:hidden;text-align:center;
  background:linear-gradient(var(--band) 0 58px,var(--card) 58px);
  border-radius:14px 14px 10px 10px;
  box-shadow:0 2px 3px rgb(40 30 50 / .25),0 26px 36px -18px rgb(40 30 50 / .55);
  transform-origin:50% 22px;transform:rotate(-2deg);
  transition:transform .6s cubic-bezier(.3,1.6,.5,1),background .5s,box-shadow .5s}
.card:hover{transform:rotate(1deg)}
/* the euro-slot hang hole punched through the header */
.card::before{content:"";position:absolute;top:14px;left:50%;width:58px;height:18px;margin-left:-29px;
  border-radius:9px;background:var(--wall);box-shadow:inset 0 2px 3px rgb(0 0 0 / .35);transition:background .6s}
.card.dark{box-shadow:0 0 0 1px #3d3650,0 26px 40px -18px rgb(0 0 0 / .8)}

.brand{position:absolute;top:16px;left:20px;font:700 22px/1 "Gaegu",cursive;color:#2b2140;transform:rotate(-4deg)}
.card.dark .brand{color:var(--soft)}

/* toggle: a pull-tag light switch on the header */
.toggle{position:absolute;top:14px;right:14px;z-index:2;padding:7px 13px;cursor:pointer;
  font:700 16px/1 "Gaegu",cursive;color:#1e1a2e;background:var(--sun);
  border:0;border-radius:999px;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .15),0 2px 3px rgb(0 0 0 / .2);
  transition:transform .15s,box-shadow .15s,background .4s}
.toggle:hover{transform:translateY(-1px)}
.toggle:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgb(0 0 0 / .15)}
.toggle:focus-visible,.connect:focus-visible,.face:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* the clear plastic blister the toy is sealed in */
.bubble{position:relative;display:block;width:172px;margin:6px auto 4px;padding:18px 0 14px;
  border-radius:44px 44px 36px 36px;background:rgb(255 255 255 / .35);
  box-shadow:inset 0 0 0 2px rgb(255 255 255 / .9),inset 0 -10px 18px rgb(120 140 170 / .12),0 0 0 1px rgb(40 30 60 / .12),0 6px 10px -4px rgb(40 30 60 / .2)}
.bubble::after{content:"";position:absolute;inset:8px auto auto 18px;width:22px;height:70px;border-radius:12px;
  background:linear-gradient(rgb(255 255 255 / .85),rgb(255 255 255 / 0));transform:rotate(14deg);pointer-events:none}
.card.dark .bubble{background:rgb(255 255 255 / .04);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .12),0 0 0 1px #000}

/* the price sticker slapped on the bubble */
.price{position:absolute;z-index:2;top:-6px;right:-26px;display:grid;place-items:center;width:58px;height:58px;
  font:700 15px/1 "Gaegu",cursive;color:#2b1a10;background:#ffb347;border-radius:50%;transform:rotate(14deg);
  box-shadow:0 0 0 3px #fff,0 2px 4px rgb(0 0 0 / .25)}
.card.dark .price{background:#6d5a35;color:#f5e6c4;box-shadow:0 0 0 3px #3a3448}

/* mascot avatar: the toy inside */
.face{position:relative;width:120px;height:120px;margin:0 auto;padding:0;cursor:pointer;
  background:var(--pink);border:3px solid var(--line);border-radius:46% 54% 50% 50%/55% 50% 50% 45%;
  box-shadow:0 0 26px var(--glow),inset -8px -10px 0 rgb(0 0 0 / .06);
  animation:wobble 5s ease-in-out infinite;transition:background .5s,box-shadow .5s}
.face.jump{animation:jump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes wobble{50%{border-radius:52% 48% 46% 54%/48% 55% 45% 52%;transform:rotate(3deg)}}
@keyframes jump{40%{transform:translateY(-14px) scale(1.06,.94)}}
.eye{position:absolute;top:38px;width:28px;height:28px;background:#fff;border:3px solid var(--line);border-radius:50%;
  display:grid;place-items:center;animation:blink 4.5s infinite}
.eye.l{left:22px}.eye.r{right:22px}
.pupil{width:11px;height:11px;background:var(--line);border-radius:50%;transition:transform .08s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mouth{position:absolute;left:50%;bottom:24px;width:34px;height:14px;transform:translateX(-50%);
  border:3px solid var(--line);border-top:0;border-radius:0 0 40px 40px;transition:all .2s}
.face.jump .mouth{height:24px;background:var(--line)}
.cheek{position:absolute;top:70px;width:14px;height:8px;border-radius:50%;background:#fff;opacity:.45}
.cheek.l{left:10px}.cheek.r{right:10px}
.hint{margin:6px 0 0;color:var(--soft);font-size:13px}
.hint b{color:var(--ink);font:700 18px/1 "Gaegu",cursive}

h1{margin:14px 0 0;font:700 34px/1.05 "Gaegu",cursive;color:var(--ink)}
.role{display:inline-block;margin:8px 0 0;padding:4px 12px;font-size:13px;color:#1e1a2e;
  background:var(--mint);border-radius:4px;transform:rotate(1.5deg);
  /* a strip of label-maker tape */
  box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.bio{min-height:48px;margin:14px auto 0;max-width:28ch;font-size:16px;line-height:1.5}
.bio::after{content:"|";margin-left:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* the free sticker sheet included in the pack */
.chips{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0;padding:16px 12px 14px;
  background:var(--sheet);border-radius:10px;box-shadow:inset 0 0 0 1px rgb(90 70 120 / .15);transition:background .5s}
.chips::before{content:"FREE stickers";position:absolute;top:-9px;left:12px;padding:1px 8px;
  font:700 13px/1.2 "Gaegu",cursive;color:#fff;background:#c8323f;border-radius:4px;transform:rotate(-3deg)}
.chip{padding:6px 12px;font-size:13px;color:#1e1a2e;cursor:pointer;
  border-radius:999px;box-shadow:0 0 0 3px #fff,0 2px 4px 2px rgb(60 40 80 / .18);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.card.dark .chip{box-shadow:0 0 0 3px #4a4360,0 0 10px 2px var(--glow)}
.chip:nth-child(1){background:var(--lilac);transform:rotate(-3deg)}
.chip:nth-child(2){background:var(--sun);transform:rotate(2deg)}
.chip:nth-child(3){background:var(--pink);transform:rotate(-2deg)}
.chip:nth-child(4){background:var(--mint);transform:rotate(3deg)}
.chip:hover{transform:rotate(0) translateY(-3px) scale(1.08)}
.chip:active{transform:scale(.92)}

/* the round "TRY ME" button cut into the packaging */
.connect{width:100%;padding:13px;cursor:pointer;font:700 22px/1 "Gaegu",cursive;
  color:#1e1a2e;background:var(--sun);border:0;border-radius:999px;
  box-shadow:inset 0 -5px 0 rgb(0 0 0 / .14),0 0 0 3px var(--card),0 0 0 5px #c8323f;
  transition:transform .12s,box-shadow .15s,background .4s}
.connect:hover{transform:translateY(-1px)}
.connect:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgb(0 0 0 / .14),0 0 0 3px var(--card),0 0 0 5px #c8323f}
.connect.on{background:var(--mint)}

/* the printed band along the bottom of the pack */
.strip{margin:24px -26px 0;padding:9px 0;overflow:hidden;white-space:nowrap;background:var(--band);color:#2b2140;
  font-size:13px;transition:background .5s}
.card.dark .strip{color:var(--soft)}
.strip span{display:inline-block;padding-left:100%;animation:scroll 14s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}

.bit{position:fixed;width:11px;height:11px;border-radius:3px;z-index:9;pointer-events:none;
  box-shadow:0 0 0 2px #fff;animation:bit 1s ease-out forwards}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* other 문방구 bits hanging on the pegboard (decorative, wide screens only) */
.rack{display:none}
@media (min-width:56rem){
  .rack{display:block;position:fixed;top:12vh;width:7.5rem;pointer-events:none;filter:drop-shadow(0 8px 8px rgb(30 30 40 / .25))}
  .rack svg{display:block;width:100%;height:auto}
  .rack.left{left:9vw;transform:rotate(-3deg)}
  .rack.right{right:9vw;top:20vh;transform:rotate(4deg)}
  body:has(.card.dark) .rack{opacity:.35}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
}
</style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
<span class="rack left" aria-hidden="true">
  <svg viewBox="0 0 120 200" focusable="false">
    <rect x="8" y="10" width="104" height="186" rx="8" fill="#9ad8ff"/>
    <rect x="42" y="20" width="36" height="12" rx="6" fill="#c9d3c6"/>
    <rect x="22" y="46" width="76" height="132" rx="10" fill="#fff" opacity=".55"/>
    <g stroke="#2b2140" stroke-width="2">
      <path d="M34 60 v100 l6 12 6 -12 v-100Z" fill="#ff8fab"/>
      <path d="M52 60 v100 l6 12 6 -12 v-100Z" fill="#ffd35c"/>
      <path d="M70 60 v100 l6 12 6 -12 v-100Z" fill="#7fdcc0"/>
    </g>
  </svg>
</span>
<span class="rack right" aria-hidden="true">
  <svg viewBox="0 0 120 170" focusable="false">
    <rect x="8" y="10" width="104" height="156" rx="8" fill="#ffd35c"/>
    <rect x="42" y="20" width="36" height="12" rx="6" fill="#c9d3c6"/>
    <rect x="24" y="52" width="72" height="44" rx="8" fill="#fff" stroke="#2b2140" stroke-width="2"/>
    <rect x="24" y="52" width="28" height="44" rx="8" fill="#c3b3ff" stroke="#2b2140" stroke-width="2"/>
    <rect x="24" y="108" width="72" height="44" rx="8" fill="#fff" stroke="#2b2140" stroke-width="2"/>
    <rect x="68" y="108" width="28" height="44" rx="8" fill="#ff8fab" stroke="#2b2140" stroke-width="2"/>
  </svg>
</span>

<div class="peg">
<article class="card" id="card">
  <span class="brand" aria-hidden="true">new friend!</span>
  <button class="toggle" id="toggle" type="button">🌙 Go dark</button>

  <span class="bubble">
    <span class="price" aria-hidden="true">₩1,000</span>
    <button class="face" id="face" type="button" aria-label="Give Sabhyata a high five">
      <span class="eye l"><span class="pupil"></span></span>
      <span class="eye r"><span class="pupil"></span></span>
      <span class="cheek l"></span><span class="cheek r"></span>
      <span class="mouth"></span>
    </button>
  </span>
  <p class="hint">Poke me! High fives: <b id="fives">0</b></p>

  <h1>Sabhyata Chhetri</h1>
  <span class="role">Designer &amp; professional overthinker</span>
  <p class="bio" id="bio"></p>

  <div class="chips">
    <span class="chip">🎨 UI design</span>
    <span class="chip">✨ Motion</span>
    <span class="chip">📚 Books</span>
    <span class="chip">☕ Coffee</span>
  </div>

  <button class="connect" id="connect" type="button">Let's connect</button>

  <div class="strip"><span>✦ let's get connected ✦ have fun ✦ make cool things ✦ say hi ✦ let's get connected ✦ have fun ✦ make cool things ✦ say hi</span></div>
</article>
</div>

<script>
// 1. Select the card and the toggle button
const card = document.querySelector('#card');
const toggleBtn = document.querySelector('#toggle');

// 2. Add a click listener to the button
toggleBtn.addEventListener('click', () => {
  // 3. Toggle the dark class
  card.classList.toggle('dark');
  // 4. Update the button text based on classList.contains('dark')
  toggleBtn.textContent = card.classList.contains('dark') ? '☀️ Go light' : '🌙 Go dark';
  toggleBtn.setAttribute('aria-pressed', card.classList.contains('dark'));
});

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// typewriter bio
const bioEl = document.querySelector('#bio');
const bioText = "Let's get connected and have fun together! 🎉";
let i = 0;
(function type(){
  bioEl.textContent = bioText.slice(0, ++i);
  if (i < bioText.length) setTimeout(type, reduce ? 0 : 55);
})();

// eyes follow the pointer
const pupils = document.querySelectorAll('.pupil');
document.addEventListener('pointermove', e => {
  pupils.forEach(p => {
    const r = p.parentElement.getBoundingClientRect();
    const a = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    p.style.transform = `translate(${Math.cos(a) * 5}px,${Math.sin(a) * 5}px)`;
  });
});

// confetti helper
function burst(x, y, n = 18) {
  if (reduce) return;
  const colors = ['#ff8fb1', '#7fdcc0', '#ffd35c', '#c3b3ff'];
  for (let k = 0; k < n; k++) {
    const b = document.createElement('span');
    b.className = 'bit';
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.background = colors[k % colors.length];
    b.style.setProperty('--dx', (Math.random() * 260 - 130) + 'px');
    b.style.setProperty('--dy', (Math.random() * -200 - 20) + 'px');
    b.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1000);
  }
}

// poke the mascot: jump, count high fives
const face = document.querySelector('#face');
const fives = document.querySelector('#fives');
let count = 0;
face.addEventListener('click', () => {
  fives.textContent = ++count;
  face.classList.remove('jump'); void face.offsetWidth; face.classList.add('jump');
  const r = face.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + 20, 10);
});

// sticker chips pop
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', e => burst(e.clientX, e.clientY, 8)));

// connect button
const connect = document.querySelector('#connect');
connect.addEventListener('click', e => {
  const on = connect.classList.toggle('on');
  connect.textContent = on ? "Connected! 🎉" : "Let's connect";
  if (on) burst(e.clientX, e.clientY, 28);
});
</script>
</body>
</html>
