<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do</title>
<style>
/* Week 4 · Task 3 — a planner page clipped to a pastel acrylic clipboard.
   Every task the JS creates with createElement becomes one written line on
   the page; ticking it off draws a red-pen strike through it. */
@font-face{font-family:"Gaegu";src:url("../assets/fonts/gaegu-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url("../assets/fonts/gowun-dodum.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Nanum Pen Script";src:url("../assets/fonts/nanum-pen-script.woff2") format("woff2");font-display:swap}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  /* day: dusty-rose desk, white dot-grid planner, lilac acrylic board */
  --desk:#c98f99;--board:rgba(214,196,245,.78);--paper:#fffdfb;--dot:rgba(140,100,120,.22);
  --ink:#2f2530;--muted:#6b5a64;--line:#eadde3;--accent:#b4234f;--accent-soft:#fde3ea;--pen:#d8334f;--hl:#ffe17a;
  margin:0;min-height:100vh;display:flex;justify-content:center;padding:72px 28px 110px;
  background:var(--desk);
  background-image:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.22),transparent 55%);
  color:var(--ink);font:400 16px/1.55 "Gowun Dodum",system-ui,sans-serif;transition:background-color .4s,color .4s}
/* night: the same planner under a desk lamp */
body:has(.app.dark){
  --desk:#1b1620;--board:rgba(120,96,160,.55);--paper:#27212f;--dot:rgba(230,210,230,.12);
  --ink:#f1e8ee;--muted:#bfb0bb;--line:#3b3244;--accent:#ff9fb6;--accent-soft:#3e2c3c;--pen:#ff7a92;--hl:#6d5a1f}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--hl);color:var(--ink)}

/* the planner sheet, sitting on the acrylic clipboard (the spread shadow) */
.app{position:relative;width:min(580px,100%);padding:54px 30px 34px;
  background:radial-gradient(circle,var(--dot) 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);
  border-radius:6px;
  box-shadow:0 0 0 18px var(--board),0 0 0 19px rgba(255,255,255,.35),0 30px 50px -18px rgba(40,10,30,.55);
  transition:background-color .4s}
/* metal clip holding the page */
.clip{position:absolute;top:-34px;left:50%;width:150px;height:52px;margin-left:-75px;border-radius:12px 12px 18px 18px;
  background:linear-gradient(#f4f5f7,#b9bec6 55%,#8f959e);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),0 6px 10px -4px rgba(30,20,40,.45)}
.clip::before{content:"";position:absolute;left:50%;top:9px;width:60px;height:14px;margin-left:-30px;border-radius:8px;
  background:#6e747d;box-shadow:inset 0 2px 3px rgba(0,0,0,.45)}
.clip::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.55)}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.date{margin:0;font:700 40px/1.05 "Gaegu",cursive;letter-spacing:-.01em;text-wrap:balance}
.left{margin:6px 0 0;font:400 24px/1.1 "Nanum Pen Script",cursive;color:var(--muted)}
/* theme toggle: a little round sticker */
.theme{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 3px var(--paper),0 2px 6px rgba(60,20,40,.25);
  transform:rotate(-8deg);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.theme:hover{transform:rotate(18deg)}
.theme svg{width:18px;height:18px}
.theme .moon{display:none}
.app.dark .theme .sun{display:none}
.app.dark .theme .moon{display:block}

/* progress: a highlighter swipe across a pencil-drawn box */
.track{height:14px;margin:24px 0 28px;border:1.5px solid var(--ink);border-radius:4px 7px 5px 6px;overflow:hidden;transform:rotate(-.4deg)}
.track i{display:block;height:100%;width:0;background:var(--hl);opacity:.9;transition:width .7s cubic-bezier(.16,1,.3,1)}

/* composer: writing on the line */
.composer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0 8px;border-bottom:2px dashed var(--line);transition:border-color .2s}
.composer:focus-within{border-bottom-color:var(--accent)}
.composer.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#task-input{flex:1 1 12rem;min-width:0;padding:10px 0;background:none;border:0;outline:none;font:400 26px/1.1 "Nanum Pen Script",cursive}
#task-input::placeholder{color:var(--muted)}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:999px;
  border:1.5px solid var(--line);color:var(--ink);font-size:13px;transition:background .2s,border-color .2s}
.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
input[type="date"]{min-height:36px;background:none;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px;padding:4px 10px;color-scheme:light}
.app.dark input[type="date"]{color-scheme:dark}
/* add: a round rubber stamp */
.add{min-width:56px;min-height:44px;padding:8px 16px;background:var(--accent);color:var(--paper);border-radius:999px;
  font:700 18px/1 "Gaegu",cursive;transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .2s cubic-bezier(.16,1,.3,1),filter .2s}
.add:hover{transform:rotate(0) translateY(-1px);filter:brightness(1.06)}
.add:active{transform:scale(.95)}
.hint{margin:10px 0 0;color:var(--muted);font-size:12.5px}
kbd{padding:1px 6px;border:1px solid var(--muted);border-radius:5px;font:inherit;font-size:12px}

/* filters: coloured index tabs */
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:30px 0 4px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:6px}
.tab{position:relative;padding:7px 14px 6px;border-radius:10px 10px 0 0;color:var(--ink);font-size:14px;
  background:var(--accent-soft);transform:translateY(2px);transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s}
.tab:nth-child(2){background:#d8f0e4}
.tab:nth-child(3){background:#fff1b8}
.app.dark .tab:nth-child(2){background:#24413a}
.app.dark .tab:nth-child(3){background:#4a4022}
.tab:hover{transform:translateY(-1px)}
.tab.on{transform:translateY(-5px);box-shadow:inset 0 -3px 0 var(--ink)}
.tab small{margin-left:5px;font-size:12px;color:var(--muted)}
.clear{min-height:36px;padding:0 2px 8px;color:var(--muted);font:400 22px/1 "Nanum Pen Script",cursive}
.clear:hover{color:var(--accent)}

/* list: one written line per task */
ul{list-style:none;margin:0;padding:0}
li{position:relative;display:flex;align-items:flex-start;gap:14px;padding:14px 2px 12px;border-bottom:1.5px dashed var(--line);
  animation:in .4s cubic-bezier(.16,1,.3,1);transition:background .2s,opacity .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
li.bye{animation:out .3s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateX(24px) rotate(2deg)}}
li.dragging{opacity:.35}
li.over{background:var(--accent-soft)}

/* the tick: a hand-drawn square box */
.tick{position:relative;flex:none;width:24px;height:24px;margin-top:3px;border:2px solid var(--ink);border-radius:4px 6px 5px 7px;
  transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s}
.tick:hover{transform:rotate(-6deg) scale(1.08)}
.tick svg{position:absolute;inset:-6px -4px auto auto;width:26px;height:26px;stroke:var(--pen);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
li.done .tick svg{stroke-dashoffset:0}

.body{flex:1;min-width:0}
.text{position:relative;display:inline;overflow-wrap:anywhere;font:400 26px/1.15 "Nanum Pen Script",cursive;transition:color .3s;
  /* red-pen strike drawn across the words when done */
  background:linear-gradient(var(--pen),var(--pen)) no-repeat 0 58%/0 2.5px;transition:background-size .35s cubic-bezier(.16,1,.3,1),color .3s}
li.done .text{color:var(--muted);background-size:100% 2.5px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:4px;color:var(--muted);font-size:13px}
.meta .late{color:var(--accent);font-weight:700}
.pri{display:inline-flex;align-items:center;gap:5px}
.pri i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.pri[data-p="med"] i{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
.pri[data-p="high"] i{background:var(--accent);border-color:var(--accent)}
.edit{width:100%;padding:0;background:none;border:0;border-bottom:2px solid var(--accent);outline:none;font:400 26px/1.15 "Nanum Pen Script",cursive}

.del{flex:none;width:32px;height:32px;border-radius:50%;color:var(--muted);opacity:0;transition:opacity .2s,background .2s,color .2s}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--accent-soft);color:var(--accent)}
@media (hover:none){.del{opacity:1}}

.empty{padding:48px 0 24px;text-align:center;color:var(--muted);font:400 26px/1.2 "Nanum Pen Script",cursive}

/* toast: a sticky note */
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 0;display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;
  background:#fff1b8;color:#2f2530;border-radius:3px;font-size:14px;transform:rotate(-1.5deg);
  box-shadow:0 10px 20px -8px rgba(40,10,30,.5);animation:in .3s ease-out;z-index:9}
.toast button{padding:4px 12px;border-radius:999px;font-weight:700;color:#fff;background:#b4234f}

@media (max-width:480px){
  body{padding:64px 22px 110px}
  .app{padding:50px 18px 28px;box-shadow:0 0 0 12px var(--board),0 0 0 13px rgba(255,255,255,.35),0 24px 40px -18px rgba(40,10,30,.55)}
  .date{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
<main class="app" id="app">
  <span class="clip" aria-hidden="true"></span>
  <header class="head">
    <div>
      <h1 class="date" id="date"></h1>
      <p class="left" id="left"></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="track" aria-hidden="true"><i id="fill"></i></div>

  <form class="composer" id="form" autocomplete="off">
    <input type="text" id="task-input" placeholder="Add a task" maxlength="100" aria-label="New task">
    <button class="ghost" id="pri" type="button" aria-label="Change priority"><span>Medium</span></button>
    <input type="date" id="due" aria-label="Due date">
    <button class="add" type="submit">Add</button>
  </form>
  <p class="hint">Press <kbd>/</kbd> to focus &middot; double-click a task to edit &middot; drag to reorder</p>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-filter="all">All<small id="c-all">0</small></button>
      <button class="tab" type="button" data-filter="active">Active<small id="c-active">0</small></button>
      <button class="tab" type="button" data-filter="done">Done<small id="c-done">0</small></button>
    </div>
    <button class="clear" id="clear" type="button">Clear done</button>
  </div>

  <ul id="task-list"></ul>
  <p class="empty" id="empty"></p>
</main>

<script>
const app = document.querySelector('#app');
const form = document.querySelector('#form');
const input = document.querySelector('#task-input');
const priBtn = document.querySelector('#pri');
const dueInp = document.querySelector('#due');
const list = document.querySelector('#task-list');
const empty = document.querySelector('#empty');
const fill = document.querySelector('#fill');
const tabs = document.querySelector('#tabs');
const themeBtn = document.querySelector('#theme');

let tasks = [], filter = 'all', lastDeleted = null, toastTimer;
const PRIS = ['low', 'med', 'high'];
const PRI_LABEL = { low: 'Low', med: 'Medium', high: 'High' };
let pri = 'med';

/* storage */
const save = () => { try { localStorage.setItem('todo-v2', JSON.stringify(tasks)); } catch (e) {} };
const load = () => { try { tasks = JSON.parse(localStorage.getItem('todo-v2')) || []; } catch (e) { tasks = []; } };

/* helpers */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const prettyDate = s => new Date(s + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const svg = (tag, attrs) => { const el = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

/* build one item with createElement */
function createItem(t) {
  const li = document.createElement('li');
  li.dataset.id = t.id;
  li.draggable = true;
  if (t.done) li.classList.add('done');

  const tick = document.createElement('button');
  tick.type = 'button';
  tick.className = 'tick';
  tick.setAttribute('role', 'checkbox');
  tick.setAttribute('aria-checked', t.done);
  tick.setAttribute('aria-label', 'Mark done');
  const s = svg('svg', { viewBox: '0 0 16 16' });
  s.appendChild(svg('path', { d: 'M3 8.5l3.2 3L13 4.5' }));
  tick.appendChild(s);

  const body = document.createElement('div');
  body.className = 'body';
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = t.text;

  const meta = document.createElement('div');
  meta.className = 'meta';
  const p = document.createElement('span');
  p.className = 'pri';
  p.dataset.p = t.pri;
  const dot = document.createElement('i');
  p.append(dot, PRI_LABEL[t.pri]);
  meta.append(p);
  if (t.due) {
    const d = document.createElement('span');
    const late = !t.done && t.due < todayStr();
    if (late) d.className = 'late';
    d.textContent = (late ? 'Overdue \u00b7 ' : '') + prettyDate(t.due);
    meta.append(d);
  }
  body.append(text, meta);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '\u2715';
  del.setAttribute('aria-label', 'Delete task');

  li.append(tick, body, del);
  return li;
}

/* render */
function render() {
  const shown = tasks.filter(t => filter === 'all' || (filter === 'done') === t.done);
  list.replaceChildren(...shown.map(createItem));

  const done = tasks.filter(t => t.done).length;
  const active = tasks.length - done;
  fill.style.width = (tasks.length ? done / tasks.length * 100 : 0) + '%';
  document.querySelector('#c-all').textContent = tasks.length;
  document.querySelector('#c-active').textContent = active;
  document.querySelector('#c-done').textContent = done;
  document.querySelector('#left').textContent = !tasks.length ? 'A clear day ahead.'
    : active === 0 ? 'Everything is done. Nice work.'
    : active + (active === 1 ? ' task left' : ' tasks left');

  empty.hidden = shown.length > 0;
  empty.textContent = !tasks.length ? 'Nothing here yet. Add your first task above.'
    : filter === 'done' ? 'Nothing finished yet.' : 'All caught up.';
}

/* add */
function addItem() {
  const text = input.value.trim();
  if (!text) {
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    return;
  }
  tasks.unshift({ id: Date.now() + Math.random(), text, done: false, pri, due: dueInp.value });
  input.value = '';      // clear the input
  dueInp.value = '';
  input.focus();
  save(); render();
}
form.addEventListener('submit', e => { e.preventDefault(); addItem(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

priBtn.addEventListener('click', () => {
  pri = PRIS[(PRIS.indexOf(pri) + 1) % 3];
  priBtn.querySelector('span').textContent = PRI_LABEL[pri];
});

/* event delegation on the list */
const idOf = el => String(el.closest('li').dataset.id);
const find = id => tasks.findIndex(t => String(t.id) === id);

list.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if (del) {
    const li = del.closest('li'), id = idOf(del);
    li.classList.add('bye');
    let gone = false;
    const remove = () => {
      if (gone) return; gone = true;
      const i = find(id);
      if (i > -1) { lastDeleted = { task: tasks[i], index: i }; tasks.splice(i, 1); }
      save(); render(); toast('Task deleted');
    };
    li.addEventListener('animationend', remove, { once: true });
    setTimeout(remove, 400);
    return;
  }
  const tick = e.target.closest('.tick');
  if (tick) {
    const t = tasks[find(idOf(tick))];
    t.done = !t.done;
    save(); render();
  }
});

/* double-click to edit */
list.addEventListener('dblclick', e => {
  const span = e.target.closest('.text');
  if (!span) return;
  const t = tasks[find(idOf(span))];
  const box = document.createElement('input');
  box.className = 'edit';
  box.value = t.text;
  box.maxLength = 100;
  span.replaceWith(box);
  box.focus(); box.select();
  let finished = false;
  const finish = commit => {
    if (finished) return; finished = true;
    if (commit && box.value.trim()) t.text = box.value.trim();
    save(); render();
  };
  box.addEventListener('keydown', ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); });
  box.addEventListener('blur', () => finish(true));
});

/* drag to reorder (delegated) */
let dragId = null;
list.addEventListener('dragstart', e => {
  const li = e.target.closest('li'); if (!li) return;
  dragId = li.dataset.id; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
list.addEventListener('dragover', e => {
  e.preventDefault();
  list.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  const li = e.target.closest('li');
  if (li && li.dataset.id !== dragId) li.classList.add('over');
});
list.addEventListener('drop', e => {
  e.preventDefault();
  const target = e.target.closest('li');
  if (!target || !dragId || target.dataset.id === dragId) return;
  const [moved] = tasks.splice(find(dragId), 1);
  tasks.splice(find(target.dataset.id), 0, moved);
  save(); render();
});
list.addEventListener('dragend', () => { dragId = null; render(); });

/* filters + clear */
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  filter = b.dataset.filter;
  tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.querySelector('#clear').addEventListener('click', () => {
  tasks = tasks.filter(t => !t.done); save(); render();
});

/* undo toast */
function toast(msg) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  const s = document.createElement('span'); s.textContent = msg;
  const u = document.createElement('button'); u.type = 'button'; u.textContent = 'Undo';
  u.addEventListener('click', () => {
    if (lastDeleted) { tasks.splice(lastDeleted.index, 0, lastDeleted.task); lastDeleted = null; save(); render(); }
    t.remove();
  });
  t.append(s, u);
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 5000);
}

/* dark mode + shortcut */
function setTheme(dark) {
  app.classList.toggle('dark', dark);
  try { localStorage.setItem('todo-dark', app.classList.contains('dark') ? '1' : '0'); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(!app.classList.contains('dark')));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
});

/* init */
document.querySelector('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
load();
try { setTheme(localStorage.getItem('todo-dark') === '1'); } catch (e) {}
render();
</script>
</body>
</html>
