<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Manrope:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  --bg:#f6f4f0;--surface:#fbfaf8;--ink:#1f1d1a;--muted:#8a857c;--line:#e4e0d8;--accent:#3d4a6b;--accent-soft:#e6e9f0;
  margin:0;min-height:100vh;display:flex;justify-content:center;padding:56px 20px 80px;
  background:var(--bg);color:var(--ink);font:400 15px/1.5 'Manrope',system-ui,sans-serif;transition:background .4s,color .4s}
body:has(.app.dark){
  --bg:#171719;--surface:#1e1e21;--ink:#dcd9d2;--muted:#84817b;--line:#2c2c30;--accent:#9aa8cf;--accent-soft:#26293a}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.app{width:min(560px,100%)}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.date{margin:0;font:400 38px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.02em}
.left{margin:8px 0 0;color:var(--muted)}
.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:border-color .2s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.theme:hover{border-color:var(--muted);transform:rotate(25deg)}
.theme svg{width:16px;height:16px}
.theme .moon{display:none}
.app.dark .theme .sun{display:none}
.app.dark .theme .moon{display:block}

/* progress */
.track{height:2px;margin:28px 0 32px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* composer */
.composer{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.composer.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#task-input{flex:1;min-width:0;padding:10px 0;background:none;border:0;outline:none}
#task-input::placeholder{color:var(--muted)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px;transition:background .2s,color .2s}
.ghost:hover{background:var(--accent-soft);color:var(--ink)}
input[type="date"]{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;border-radius:8px;width:auto;color-scheme:light}
.app.dark input[type="date"]{color-scheme:dark}
.add{padding:8px 16px;background:var(--ink);color:var(--bg);border-radius:10px;font-weight:600;font-size:14px;transition:opacity .2s,transform .15s}
.add:hover{opacity:.85}
.add:active{transform:scale(.96)}
.hint{margin:10px 4px 0;color:var(--muted);font-size:12px}
kbd{padding:1px 6px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:11px}

/* filters */
.bar{display:flex;align-items:center;justify-content:space-between;margin:32px 0 6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:22px}
.tab{position:relative;padding:8px 0 12px;color:var(--muted);font-weight:500;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.tab small{margin-left:4px;color:var(--muted);font-size:12px}
.clear{padding-bottom:10px;color:var(--muted);font-size:13px}
.clear:hover{color:var(--ink)}

/* list */
ul{list-style:none;margin:0;padding:0}
li{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);
  animation:in .4s cubic-bezier(.2,.8,.2,1);transition:background .2s,opacity .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
li.bye{animation:out .3s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateX(24px)}}
li.dragging{opacity:.35}
li.over{background:var(--accent-soft)}

.tick{position:relative;flex:none;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--muted);border-radius:50%;
  transition:background .25s,border-color .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.tick:hover{border-color:var(--ink);transform:scale(1.1)}
.tick svg{position:absolute;inset:2px;width:12px;height:12px;stroke:var(--bg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
li.done .tick{background:var(--accent);border-color:var(--accent)}
li.done .tick svg{stroke-dashoffset:0}

.body{flex:1;min-width:0}
.text{display:block;overflow-wrap:anywhere;transition:color .3s}
li.done .text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;align-items:center;gap:10px;margin-top:2px;color:var(--muted);font-size:12.5px}
.meta .late{color:var(--accent);font-weight:600}
.pri{display:inline-flex;align-items:center;gap:5px}
.pri i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.pri[data-p="med"] i{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
.pri[data-p="high"] i{background:var(--accent);border-color:var(--accent)}
.edit{width:100%;padding:0;background:none;border:0;border-bottom:1px solid var(--accent);outline:none}

.del{flex:none;width:28px;height:28px;border-radius:8px;color:var(--muted);opacity:0;transition:opacity .2s,background .2s,color .2s}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--accent-soft);color:var(--ink)}
@media (hover:none){.del{opacity:1}}

.empty{padding:56px 0;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 0;display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;
  background:var(--ink);color:var(--bg);border-radius:12px;font-size:14px;animation:in .3s ease-out;z-index:9}
.toast button{padding:4px 10px;border-radius:8px;font-weight:600;color:var(--bg);background:rgba(128,128,128,.3)}

@media (max-width:480px){.date{font-size:30px}.ghost span{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="head">
    <div>
      <h1 class="date" id="date"></h1>
      <p class="left" id="left"></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="track" aria-hidden="true"><i id="fill"></i></div>

  <form class="composer" id="form" autocomplete="off">
    <input type="text" id="task-input" placeholder="Add a task" maxlength="100" aria-label="New task">
    <button class="ghost" id="pri" type="button" aria-label="Change priority"><span>Medium</span></button>
    <input type="date" id="due" aria-label="Due date">
    <button class="add" type="submit">Add</button>
  </form>
  <p class="hint">Press <kbd>/</kbd> to focus &middot; double-click a task to edit &middot; drag to reorder</p>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-filter="all">All<small id="c-all">0</small></button>
      <button class="tab" type="button" data-filter="active">Active<small id="c-active">0</small></button>
      <button class="tab" type="button" data-filter="done">Done<small id="c-done">0</small></button>
    </div>
    <button class="clear" id="clear" type="button">Clear done</button>
  </div>

  <ul id="task-list"></ul>
  <p class="empty" id="empty"></p>
</main>

<script>
const app = document.querySelector('#app');
const form = document.querySelector('#form');
const input = document.querySelector('#task-input');
const priBtn = document.querySelector('#pri');
const dueInp = document.querySelector('#due');
const list = document.querySelector('#task-list');
const empty = document.querySelector('#empty');
const fill = document.querySelector('#fill');
const tabs = document.querySelector('#tabs');
const themeBtn = document.querySelector('#theme');

let tasks = [], filter = 'all', lastDeleted = null, toastTimer;
const PRIS = ['low', 'med', 'high'];
const PRI_LABEL = { low: 'Low', med: 'Medium', high: 'High' };
let pri = 'med';

/* storage */
const save = () => { try { localStorage.setItem('todo-v2', JSON.stringify(tasks)); } catch (e) {} };
const load = () => { try { tasks = JSON.parse(localStorage.getItem('todo-v2')) || []; } catch (e) { tasks = []; } };

/* helpers */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const prettyDate = s => new Date(s + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const svg = (tag, attrs) => { const el = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

/* build one item with createElement */
function createItem(t) {
  const li = document.createElement('li');
  li.dataset.id = t.id;
  li.draggable = true;
  if (t.done) li.classList.add('done');

  const tick = document.createElement('button');
  tick.type = 'button';
  tick.className = 'tick';
  tick.setAttribute('role', 'checkbox');
  tick.setAttribute('aria-checked', t.done);
  tick.setAttribute('aria-label', 'Mark done');
  const s = svg('svg', { viewBox: '0 0 16 16' });
  s.appendChild(svg('path', { d: 'M3 8.5l3.2 3L13 4.5' }));
  tick.appendChild(s);

  const body = document.createElement('div');
  body.className = 'body';
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = t.text;

  const meta = document.createElement('div');
  meta.className = 'meta';
  const p = document.createElement('span');
  p.className = 'pri';
  p.dataset.p = t.pri;
  const dot = document.createElement('i');
  p.append(dot, PRI_LABEL[t.pri]);
  meta.append(p);
  if (t.due) {
    const d = document.createElement('span');
    const late = !t.done && t.due < todayStr();
    if (late) d.className = 'late';
    d.textContent = (late ? 'Overdue \u00b7 ' : '') + prettyDate(t.due);
    meta.append(d);
  }
  body.append(text, meta);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '\u2715';
  del.setAttribute('aria-label', 'Delete task');

  li.append(tick, body, del);
  return li;
}

/* render */
function render() {
  const shown = tasks.filter(t => filter === 'all' || (filter === 'done') === t.done);
  list.replaceChildren(...shown.map(createItem));

  const done = tasks.filter(t => t.done).length;
  const active = tasks.length - done;
  fill.style.width = (tasks.length ? done / tasks.length * 100 : 0) + '%';
  document.querySelector('#c-all').textContent = tasks.length;
  document.querySelector('#c-active').textContent = active;
  document.querySelector('#c-done').textContent = done;
  document.querySelector('#left').textContent = !tasks.length ? 'A clear day ahead.'
    : active === 0 ? 'Everything is done. Nice work.'
    : active + (active === 1 ? ' task left' : ' tasks left');

  empty.hidden = shown.length > 0;
  empty.textContent = !tasks.length ? 'Nothing here yet. Add your first task above.'
    : filter === 'done' ? 'Nothing finished yet.' : 'All caught up.';
}

/* add */
function addItem() {
  const text = input.value.trim();
  if (!text) {
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    return;
  }
  tasks.unshift({ id: Date.now() + Math.random(), text, done: false, pri, due: dueInp.value });
  input.value = '';      // clear the input
  dueInp.value = '';
  input.focus();
  save(); render();
}
form.addEventListener('submit', e => { e.preventDefault(); addItem(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

priBtn.addEventListener('click', () => {
  pri = PRIS[(PRIS.indexOf(pri) + 1) % 3];
  priBtn.querySelector('span').textContent = PRI_LABEL[pri];
});

/* event delegation on the list */
const idOf = el => String(el.closest('li').dataset.id);
const find = id => tasks.findIndex(t => String(t.id) === id);

list.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if (del) {
    const li = del.closest('li'), id = idOf(del);
    li.classList.add('bye');
    let gone = false;
    const remove = () => {
      if (gone) return; gone = true;
      const i = find(id);
      if (i > -1) { lastDeleted = { task: tasks[i], index: i }; tasks.splice(i, 1); }
      save(); render(); toast('Task deleted');
    };
    li.addEventListener('animationend', remove, { once: true });
    setTimeout(remove, 400);
    return;
  }
  const tick = e.target.closest('.tick');
  if (tick) {
    const t = tasks[find(idOf(tick))];
    t.done = !t.done;
    save(); render();
  }
});

/* double-click to edit */
list.addEventListener('dblclick', e => {
  const span = e.target.closest('.text');
  if (!span) return;
  const t = tasks[find(idOf(span))];
  const box = document.createElement('input');
  box.className = 'edit';
  box.value = t.text;
  box.maxLength = 100;
  span.replaceWith(box);
  box.focus(); box.select();
  let finished = false;
  const finish = commit => {
    if (finished) return; finished = true;
    if (commit && box.value.trim()) t.text = box.value.trim();
    save(); render();
  };
  box.addEventListener('keydown', ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); });
  box.addEventListener('blur', () => finish(true));
});

/* drag to reorder (delegated) */
let dragId = null;
list.addEventListener('dragstart', e => {
  const li = e.target.closest('li'); if (!li) return;
  dragId = li.dataset.id; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
list.addEventListener('dragover', e => {
  e.preventDefault();
  list.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  const li = e.target.closest('li');
  if (li && li.dataset.id !== dragId) li.classList.add('over');
});
list.addEventListener('drop', e => {
  e.preventDefault();
  const target = e.target.closest('li');
  if (!target || !dragId || target.dataset.id === dragId) return;
  const [moved] = tasks.splice(find(dragId), 1);
  tasks.splice(find(target.dataset.id), 0, moved);
  save(); render();
});
list.addEventListener('dragend', () => { dragId = null; render(); });

/* filters + clear */
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  filter = b.dataset.filter;
  tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.querySelector('#clear').addEventListener('click', () => {
  tasks = tasks.filter(t => !t.done); save(); render();
});

/* undo toast */
function toast(msg) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  const s = document.createElement('span'); s.textContent = msg;
  const u = document.createElement('button'); u.type = 'button'; u.textContent = 'Undo';
  u.addEventListener('click', () => {
    if (lastDeleted) { tasks.splice(lastDeleted.index, 0, lastDeleted.task); lastDeleted = null; save(); render(); }
    t.remove();
  });
  t.append(s, u);
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 5000);
}

/* dark mode + shortcut */
function setTheme(dark) {
  app.classList.toggle('dark', dark);
  try { localStorage.setItem('todo-dark', app.classList.contains('dark') ? '1' : '0'); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(!app.classList.contains('dark')));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
});

/* init */
document.querySelector('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
load();
try { setTheme(localStorage.getItem('todo-dark') === '1'); } catch (e) {}
render();
</script>
</body>
</html>
