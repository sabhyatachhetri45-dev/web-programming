<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student directory</title>
<style>
/* Week 4 · Task 4 — a school yearbook spread. Every student row the JS
   creates becomes a portrait slot; filter() hides the ones that don't match,
   so the yearbook page reflows to show only the friends you searched for. */
@font-face{font-family:"Gaegu";src:url("../assets/fonts/gaegu-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url("../assets/fonts/gowun-dodum.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Nanum Pen Script";src:url("../assets/fonts/nanum-pen-script.woff2") format("woff2");font-display:swap}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  /* day: bottle-green yearbook cover around an ivory page */
  --cover:#1f4a3d;--cover-2:#173a30;--page:#fbf8f2;--ink:#22302b;--muted:#5d6a64;--line:#dfe4dc;
  --accent:#1f6b55;--accent-soft:#e2f1ea;--mark:#ffe17a;--gold:#c9a24a;
  margin:0;min-height:100vh;display:flex;justify-content:center;padding:44px 20px 110px;
  background:var(--cover);
  color:var(--ink);font:400 15px/1.5 "Gowun Dodum",system-ui,sans-serif;transition:background-color .4s,color .4s}
/* night: navy cover, page dimmed like reading under a lamp */
body:has(.app.dark){
  --cover:#121826;--cover-2:#0c111c;--page:#1f2533;--ink:#ecebe6;--muted:#b3b8c2;--line:#323a4b;
  --accent:#8fd6bd;--accent-soft:#24344a;--mark:#6d5a1f;--gold:#d9b765}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--mark);color:var(--ink)}

/* the open yearbook page, with a gold foil frame line */
.app{position:relative;width:min(980px,100%);padding:40px 36px 44px;background:var(--page);border-radius:6px 14px 14px 6px;
  box-shadow:inset 18px 0 24px -20px rgba(0,0,0,.25),0 0 0 10px var(--cover-2),0 34px 60px -24px rgba(0,0,0,.6);transition:background-color .4s}
.app::before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold);border-radius:4px 10px 10px 4px;opacity:.55;pointer-events:none}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;text-align:left}
h1{margin:0;font:700 44px/1.05 "Gaegu",cursive;letter-spacing:-.01em;color:var(--accent)}
.sub{margin:6px 0 0;font:400 23px/1.15 "Nanum Pen Script",cursive;color:var(--muted)}
.theme{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--gold);
  border:1.5px solid var(--gold);transition:transform .5s cubic-bezier(.16,1,.3,1),background .2s}
.theme:hover{transform:rotate(20deg);background:var(--accent-soft)}
.theme svg{width:18px;height:18px}
.theme .moon{display:none}
.app.dark .theme .sun{display:none}
.app.dark .theme .moon{display:block}

/* search: a name label you write into */
.search{position:relative;display:flex;align-items:center;gap:10px;margin-top:26px;padding:4px 10px 4px 16px;
  background:var(--page);border:1.5px solid var(--ink);border-radius:999px;box-shadow:3px 4px 8px -4px rgba(0,0,0,.25);transition:box-shadow .2s,border-color .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{flex:none;width:18px;height:18px;color:var(--muted)}
#search{flex:1;min-width:0;padding:12px 0;background:none;border:0;outline:none;font-size:16px}
#search::placeholder{color:var(--muted)}
#search::-webkit-search-cancel-button{display:none}
kbd{padding:1px 7px;border:1px solid var(--muted);border-radius:5px;color:var(--muted);font:inherit;font-size:12px;transition:opacity .2s}
.search:focus-within kbd,.search.has-text kbd{display:none}
.clear{display:none;width:30px;height:30px;border-radius:50%;color:var(--muted);transition:background .2s,color .2s}
.clear:hover{background:var(--accent-soft);color:var(--ink)}
.search.has-text .clear{display:block}

/* program tabs: club ribbons */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font-size:14px;
  transition:background .2s,border-color .2s,transform .2s cubic-bezier(.16,1,.3,1)}
.tab:hover{border-color:var(--accent);transform:translateY(-1px)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--page)}
.sort{flex:none;min-height:36px;padding:0 4px;color:var(--muted);font:400 22px/1 "Nanum Pen Script",cursive;transition:color .2s}
.sort:hover{color:var(--accent)}
.status{margin:10px 0 0;color:var(--muted);font-size:13px}

/* the portrait grid */
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px;margin:22px 0 0;padding:0;list-style:none}
.student{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  transform:rotate(var(--tilt,0deg));transition:transform .35s cubic-bezier(.16,1,.3,1)}
.student:nth-child(3n+1){--tilt:-1.2deg}
.student:nth-child(3n+2){--tilt:.8deg}
.student:hover{transform:rotate(0) translateY(-4px)}
.student.pop{animation:in .35s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
/* the "photo": a pastel portrait slot with the initials drawn in */
.avatar{width:100%;aspect-ratio:4/5;margin-bottom:10px;display:grid;place-items:center;border:7px solid #fff;border-radius:3px;
  background:linear-gradient(160deg,#ffd6df,#f8b9c8);color:#5a2a3a;font:700 46px/1 "Gaegu",cursive;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 16px -10px rgba(0,0,0,.4)}
.student:nth-child(4n+2) .avatar{background:linear-gradient(160deg,#d4efe3,#aedcc8);color:#1f4a3d}
.student:nth-child(4n+3) .avatar{background:linear-gradient(160deg,#dbe8fb,#b6cdf2);color:#22385e}
.student:nth-child(4n+4) .avatar{background:linear-gradient(160deg,#fff0c2,#f6db8d);color:#5a4413}
.app.dark .avatar{border-color:#eceae4}
.name{display:block;font:700 19px/1.15 "Gaegu",cursive}
.roll{display:block;color:var(--muted);font-size:13px;letter-spacing:.03em}
.program{margin-top:2px;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12.5px}
mark{padding:0 2px;margin:0 -2px;color:inherit;background:linear-gradient(transparent 40%,var(--mark) 40%);border-radius:2px}

.empty{display:none;padding:48px 0;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font:700 28px/1.1 "Gaegu",cursive}
.empty button{margin-top:14px;min-height:40px;padding:6px 16px;border:1.5px solid var(--ink);border-radius:999px;font-size:14px;transition:background .2s}
.empty button:hover{background:var(--accent-soft)}

@media (max-width:560px){
  body{padding:28px 14px 110px}
  .app{padding:34px 18px 36px}
  .app::before{inset:8px}
  h1{font-size:34px}
  #list{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .avatar{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
<main class="app" id="app">
  <header class="head">
    <div>
      <h1>Student directory</h1>
      <p class="sub">Start typing to filter by name or roll number.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="search" id="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="search" placeholder="Search students" autocomplete="off" spellcheck="false" aria-label="Search students">
    <kbd>/</kbd>
    <button class="clear" id="clear" type="button" aria-label="Clear search">&#x2715;</button>
  </div>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <button class="sort" id="sort" type="button">Sort: A to Z</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <ul id="list"></ul>

  <div class="empty" id="empty">
    <b>No students found</b>
    <span id="empty-msg">Try a different spelling or fewer letters.</span><br>
    <button type="button" id="reset">Reset search</button>
  </div>
</main>

<script>
/* ---------- data ---------- */
const STUDENTS = [
  ['Sabhyata Chhetri','S-1001','Design'],
  ['Vision Parajuli','S-1002','Computer Science'],
  ['Prashna Rai','S-1003','Architecture'],
  ['Bhumika Adikari','S-1004','Design'],
  ['Sanjita Tamang','S-1005','Economics'],
  ['Kusum Ale Magar','S-1006','Architecture'],
  ['Ritu Moktan','S-1007','Design'],
  ['Anusha Ghimre','S-1008','Economics'],
  ['Yogesh Khanal','S-1009','Computer Science'],
  ['Raman Parajuli','S-1010','Computer Science']
].map(([name, roll, program]) => ({ name, roll, program }));

const app = document.querySelector('#app');
const box = document.querySelector('#box');
const search = document.querySelector('#search');
const list = document.querySelector('#list');
const tabs = document.querySelector('#tabs');
const status = document.querySelector('#status');
const empty = document.querySelector('#empty');
let program = 'All';
let asc = true;

/* ---------- helpers ---------- */
const escapeHTML = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// wrap every search word found in `text` with <mark>
function highlight(text, words) {
  const safe = escapeHTML(text);
  if (!words.length) return safe;
  const re = new RegExp('(' + words.map(escapeRegex).join('|') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

/* ---------- build rows once with createElement ---------- */
function buildRows() {
  const sorted = [...STUDENTS].sort((a, b) => asc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  list.replaceChildren(...sorted.map(s => {
    const li = document.createElement('li');
    li.className = 'student pop';
    li.dataset.name = s.name;
    li.dataset.roll = s.roll;
    li.dataset.program = s.program;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = s.name.split(' ').map(w => w[0]).slice(0, 2).join('');

    const info = document.createElement('div');
    const n = document.createElement('span'); n.className = 'name'; n.textContent = s.name;
    const r = document.createElement('span'); r.className = 'roll'; r.textContent = s.roll;
    info.append(n, r);

    const p = document.createElement('div');
    p.className = 'program';
    p.textContent = s.program;

    li.append(av, info, p);
    return li;
  }));
}

/* ---------- the filter ---------- */
function filter(term) {
  const words = term.split(/\s+/).filter(Boolean);          // "sab chh" -> ["sab","chh"]
  const rows = document.querySelectorAll('.student');
  let shown = 0;

  rows.forEach(row => {
    const name = row.dataset.name;
    const roll = row.dataset.roll;
    const hay = (name + ' ' + roll).toLowerCase();

    const matchesText = words.every(w => hay.includes(w));   // every word must match
    const matchesProgram = program === 'All' || row.dataset.program === program;
    const visible = matchesText && matchesProgram;

    row.style.display = visible ? '' : 'none';
    if (visible) {
      shown++;
      // BONUS: highlight the match (content is our own and escaped first)
      row.querySelector('.name').innerHTML = highlight(name, words);
      row.querySelector('.roll').innerHTML = highlight(roll, words);
    }
  });

  empty.style.display = shown ? 'none' : 'block';
  document.querySelector('#empty-msg').textContent = program !== 'All' && !words.length
    ? 'No students in this program yet.'
    : 'Try a different spelling or fewer letters.';
  box.classList.toggle('has-text', term.length > 0);
  status.textContent = words.length || program !== 'All'
    ? `Showing ${shown} of ${STUDENTS.length} students`
    : `${STUDENTS.length} students`;
}

/* ---------- events ---------- */
search.addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  filter(term);
});

const clearSearch = () => { search.value = ''; filter(''); search.focus(); };
document.querySelector('#clear').addEventListener('click', clearSearch);
document.querySelector('#reset').addEventListener('click', () => { setProgram('All'); clearSearch(); });

// program tabs
const programs = ['All', ...new Set(STUDENTS.map(s => s.program))];
programs.forEach(p => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab' + (p === 'All' ? ' on' : '');
  b.textContent = p;
  b.dataset.program = p;
  tabs.appendChild(b);
});
function setProgram(p) {
  program = p;
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.program === p));
  filter(search.value.toLowerCase());
}
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) setProgram(b.dataset.program);
});

// sort
document.querySelector('#sort').addEventListener('click', e => {
  asc = !asc;
  e.target.textContent = asc ? 'Sort: A to Z' : 'Sort: Z to A';
  buildRows();
  filter(search.value.toLowerCase());
  document.querySelectorAll('.student').forEach(r => r.classList.remove('pop'));
});

// keyboard: "/" focuses the search, Esc clears it
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  if (e.key === 'Escape' && document.activeElement === search) { search.value ? clearSearch() : search.blur(); }
});

// dark mode
const themeBtn = document.querySelector('#theme');
function setTheme(dark) {
  app.classList.toggle('dark', dark);
  try { localStorage.setItem('dir-dark', app.classList.contains('dark') ? '1' : '0'); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(!app.classList.contains('dark')));

/* ---------- init ---------- */
buildRows();
try { setTheme(localStorage.getItem('dir-dark') === '1'); } catch (e) {}
filter('');
</script>
</body>
</html>
</html>
