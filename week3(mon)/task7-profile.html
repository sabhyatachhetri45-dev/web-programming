<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>

  <style>
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }

    /*
      The idea: a student ID hanging from a lanyard in a clear plastic holder.
      The lesson is centering: body uses flexbox (justify-content + align-items)
      to put the card in the middle of the screen, and the avatar uses the
      same trick to centre its letter.
    */

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 7rem 1.25rem 6rem;
      overflow-x: hidden;
      font-family: "Gowun Dodum", sans-serif;
      background-color: #f1f5f9;
      background-image: radial-gradient(ellipse at 50% 30%, #ffffff 0%, transparent 65%);
    }

    /* Everything that swings together: lanyard clip, holder and card. */
    .badge {
      position: relative;
      transform-origin: 50% -7rem;
      transform: rotate(-2deg);
      transition: transform 1000ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge:hover { transform: rotate(2.5deg); }

    /* The lanyard strap, running up off the top of the screen. */
    .badge::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 1.4rem;
      height: 100vh;
      margin-left: -0.7rem;
      margin-bottom: 1.5rem;
      background:
        repeating-linear-gradient(0deg, transparent 0 1.6rem, rgba(255, 255, 255, 0.55) 1.6rem 1.75rem),
        #16a34a;
      border-radius: 2px;
    }

    /* The metal clip joining strap to holder. */
    .clip {
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 2.2rem;
      height: 2.2rem;
      margin-left: -1.1rem;
      margin-bottom: -0.2rem;
      border: 0.3rem solid #94a3b8;
      border-bottom-color: transparent;
      border-radius: 50% 50% 0.4rem 0.4rem;
    }

    /* The clear plastic holder around the card. */
    .holder {
      padding: 1.7rem 0.6rem 0.6rem;
      background-color: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.6);
      border-radius: 1rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 24px 40px -22px rgba(30, 41, 59, 0.45);
      background-image: linear-gradient(115deg, rgba(255, 255, 255, 0.7) 0 18%, transparent 18% 40%, rgba(255, 255, 255, 0.35) 40% 46%, transparent 46%);
    }

    /* the slot punched in the top of the holder */
    .holder::before {
      content: "";
      display: block;
      width: 3.2rem;
      height: 0.55rem;
      margin: -1.15rem auto 0.6rem;
      border-radius: 1rem;
      background-color: #e2e8f0;
      box-shadow: inset 0 1px 2px rgba(30, 41, 59, 0.3);
    }

    .profile-card {
      position: relative;
      width: min(20rem, calc(100vw - 4rem));
      padding: 0 1.5rem 1.4rem;
      background-color: white;
      border-radius: 0.6rem;
      text-align: center;
      box-shadow: 0 1px 3px rgba(30, 41, 59, 0.12);
      overflow: hidden;
    }

    /* The coloured band printed across the top of the ID. */
    .profile-card::before {
      content: "";
      display: block;
      height: 4.2rem;
      margin: 0 -1.5rem;
      background-color: #16a34a;
      background-image:
        radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.22) 0 1.6rem, transparent 1.65rem),
        radial-gradient(circle at 12% 120%, rgba(255, 255, 255, 0.16) 0 2.4rem, transparent 2.45rem);
    }

    /* The ID photo. Flexbox centres the letter both ways. */
    .avatar {
      width: 5.5rem;
      height: 6.6rem;
      margin: -2.8rem auto 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #dcfce7;
      color: #15803d;
      border: 0.3rem solid white;
      border-radius: 0.5rem;
      box-shadow: 0 2px 6px rgba(30, 41, 59, 0.18);
      font-family: "Gaegu", sans-serif;
      font-size: 3rem;
      font-weight: bold;
    }

    .name {
      margin: 0;
      font-family: "Gaegu", sans-serif;
      font-size: 1.9rem;
      line-height: 1.1;
      font-weight: bold;
      color: #1e293b;
    }

    .role {
      margin: 0.4rem 0 1.1rem;
      color: #475569;
    }

    /* A perforated line, like the tear-off part of a card. */
    hr {
      border: none;
      border-top: 2px dotted #cbd5e1;
      margin: 0 -0.5rem 1.1rem;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Skills look like little stamped stickers. */
    .skill {
      padding: 0.35rem 0.8rem;
      background-color: #f0fdf4;
      color: #166534;
      border: 1.5px solid #16a34a;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* A barcode strip along the bottom of the card. */
    .barcode {
      height: 1.6rem;
      margin: 1.3rem 0.5rem 0;
      background: repeating-linear-gradient(90deg,
        #1e293b 0 2px, transparent 2px 4px, #1e293b 4px 5px, transparent 5px 8px,
        #1e293b 8px 11px, transparent 11px 12px, #1e293b 12px 13px, transparent 13px 16px);
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .badge { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>

<body>

  <div class="badge">
    <span class="clip" aria-hidden="true"></span>
    <div class="holder">
      <div class="profile-card">

        <div class="avatar">S</div>

        <h1 class="name">Sabhyata Chhetri</h1>

        <p class="role">Computer Science Student</p>

        <hr>

        <div class="skills">
          <span class="skill">HTML</span>
          <span class="skill">CSS</span>
          <span class="skill">Python</span>
          <span class="skill">Git</span>
        </div>

        <div class="barcode" aria-hidden="true"></div>

      </div>
    </div>
  </div>

</body>
</html>
