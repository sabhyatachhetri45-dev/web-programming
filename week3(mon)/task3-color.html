<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Swatches</title>

    <style>
        @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
        @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 3rem 1rem 7rem;
            font-family: "Gaegu", sans-serif;
            background: #dfe8ee radial-gradient(ellipse at 50% 40%, #f0f5f8, transparent 70%);
        }

        /* A watercolour tin: the lid is the tin's back half, the pans sit in the tray. */
        .tin {
            position: relative;
            width: min(46rem, 100%);
            padding: 1.1rem;
            border-radius: 1.1rem;
            background: linear-gradient(145deg, #e9edf0, #c9d0d6 55%, #b4bcc4);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -2px 4px rgba(60, 70, 80, 0.25),
                0 24px 40px -22px rgba(60, 50, 40, 0.5);
        }

        .tin::before {
            content: "";
            position: absolute;
            inset: 0.55rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.55);
            pointer-events: none;
        }

        /* Flexbox lines the pans up in a row, with a gap between each one. */
        .swatch-card {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 0.9rem;
            border-radius: 0.7rem;
            background: #fbfaf7;
            box-shadow: inset 0 2px 6px rgba(60, 70, 80, 0.25);
        }

        /* Each pan: the hex code is written right in the paint. */
        .swatch {
            position: relative;
            flex: 1 1 7rem;
            display: grid;
            place-items: end center;
            min-height: 8.5rem;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 0.02em;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            box-shadow:
                inset 0 0 0 4px rgba(255, 255, 255, 0.7),
                inset 0 6px 10px rgba(0, 0, 0, 0.18),
                0 1px 0 rgba(255, 255, 255, 0.9);
            transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* A wet shine and the dip a brush has worn into the cake of paint. */
        .swatch::before {
            content: "";
            position: absolute;
            top: 1.2rem;
            left: 50%;
            width: 3.2rem;
            height: 2.2rem;
            margin-left: -1.6rem;
            border-radius: 50%;
            background: radial-gradient(ellipse at 40% 35%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 65%);
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.22);
        }

        .swatch:hover { transform: translateY(-6px) rotate(-1.5deg); }

        .purple {
            background-color: #7c3aed;
        }

        .blue {
            background-color: #0369a1;
        }

        .green {
            background-color: #16a34a;
            /* white on this green is only 3.3:1, so the label uses dark ink */
            color: #14110d;
        }

        .orange {
            background-color: #ea580c;
            color: #14110d;
        }

        .pink {
            background-color: #db2777;
        }

        /* A brush resting across the tin. */
        .brush {
            position: absolute;
            left: 8%;
            bottom: -1.4rem;
            width: 70%;
            height: 0.7rem;
            border-radius: 0.4rem;
            background: linear-gradient(#d89b5f, #b06d32);
            transform: rotate(-3deg);
            box-shadow: 0 6px 8px -4px rgba(60, 40, 20, 0.45);
        }
        .brush::before {
            content: "";
            position: absolute;
            right: -3.2rem;
            top: -0.1rem;
            width: 3.4rem;
            height: 0.9rem;
            border-radius: 0.2rem 0.5rem 0.5rem 0.2rem;
            background: linear-gradient(#e5e9ec, #9aa3ab);
        }
        .brush::after {
            content: "";
            position: absolute;
            right: -5.2rem;
            top: -0.15rem;
            width: 2.2rem;
            height: 1rem;
            border-radius: 0 60% 60% 0 / 0 50% 50% 0;
            background: linear-gradient(90deg, #4a3427, #db2777);
        }

        .label {
            position: absolute;
            right: 1.6rem;
            top: -2.1rem;
            font-family: "Nanum Pen Script", cursive;
            font-size: 1.6rem;
            color: #5a4c40;
            transform: rotate(3deg);
        }

        @media (max-width: 30rem) {
            .swatch { flex-basis: 40%; min-height: 7rem; }
            .brush { width: 55%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .swatch { transition: none; }
        }
    </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>

<body>

    <main class="tin">
        <span class="label" aria-hidden="true">my five favourite pans</span>
        <div class="swatch-card">
            <div class="swatch purple">#7c3aed</div>
            <div class="swatch blue">#0369a1</div>
            <div class="swatch green">#16a34a</div>
            <div class="swatch orange">#ea580c</div>
            <div class="swatch pink">#db2777</div>
        </div>
        <span class="brush" aria-hidden="true"></span>
    </main>

</body>
</html>
