<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student directory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Manrope:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  --bg:#f6f4f0;--surface:#fbfaf8;--ink:#1f1d1a;--muted:#8a857c;--line:#e4e0d8;--accent:#3d4a6b;--accent-soft:#e6e9f0;--mark:#dfe3ee;
  margin:0;min-height:100vh;display:flex;justify-content:center;padding:56px 20px 80px;
  background:var(--bg);color:var(--ink);font:400 15px/1.5 'Manrope',system-ui,sans-serif;transition:background .4s,color .4s}
body:has(.app.dark){
  --bg:#171719;--surface:#1e1e21;--ink:#dcd9d2;--muted:#84817b;--line:#2c2c30;--accent:#9aa8cf;--accent-soft:#26293a;--mark:#31364d}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.app{width:min(620px,100%)}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{margin:0;font:400 38px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.02em}
.sub{margin:8px 0 0;color:var(--muted)}
.theme{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
  transition:border-color .2s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.theme:hover{border-color:var(--muted);transform:rotate(25deg)}
.theme svg{width:16px;height:16px}
.theme .moon{display:none}
.app.dark .theme .sun{display:none}
.app.dark .theme .moon{display:block}

/* search */
.search{position:relative;display:flex;align-items:center;gap:10px;margin-top:32px;padding:4px 10px 4px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{flex:none;width:18px;height:18px;color:var(--muted)}
#search{flex:1;min-width:0;padding:12px 0;background:none;border:0;outline:none}
#search::placeholder{color:var(--muted)}
#search::-webkit-search-cancel-button{display:none}
kbd{padding:1px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font:inherit;font-size:12px;transition:opacity .2s}
.search:focus-within kbd,.search.has-text kbd{display:none}
.clear{display:none;width:26px;height:26px;border-radius:50%;color:var(--muted);transition:background .2s,color .2s}
.clear:hover{background:var(--accent-soft);color:var(--ink)}
.search.has-text .clear{display:block}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 4px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:8px 0 12px;color:var(--muted);font-weight:500;transition:color .2s}
.tab:hover,.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.sort{flex:none;padding-bottom:10px;color:var(--muted);font-size:13px;transition:color .2s}
.sort:hover{color:var(--ink)}
.status{margin:12px 0 0;color:var(--muted);font-size:13px}

/* rows */
#list{margin:6px 0 0;padding:0;list-style:none}
.student{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);
  transition:background .2s,padding .25s cubic-bezier(.2,.8,.2,1)}
.student:hover{background:var(--accent-soft);padding-left:12px;padding-right:12px;border-radius:10px}
.student.pop{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.avatar{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
  color:var(--muted);font:500 15px 'Newsreader',Georgia,serif;transition:border-color .2s,color .2s}
.student:hover .avatar{border-color:var(--accent);color:var(--accent)}
.name{display:block;font-weight:600}
.roll{display:block;color:var(--muted);font-size:13px}
.program{color:var(--muted);font-size:13px;text-align:right}
mark{padding:0 2px;margin:0 -2px;color:inherit;background:var(--mark);border-radius:3px;box-shadow:0 1px 0 var(--accent)}

.empty{display:none;padding:56px 0;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font:400 22px 'Newsreader',Georgia,serif}
.empty button{margin-top:14px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;transition:border-color .2s}
.empty button:hover{border-color:var(--muted)}

@media (max-width:480px){h1{font-size:30px}.student{grid-template-columns:40px 1fr}.program{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="head">
    <div>
      <h1>Student directory</h1>
      <p class="sub">Start typing to filter by name or roll number.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="search" id="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="search" placeholder="Search students" autocomplete="off" spellcheck="false" aria-label="Search students">
    <kbd>/</kbd>
    <button class="clear" id="clear" type="button" aria-label="Clear search">&#x2715;</button>
  </div>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <button class="sort" id="sort" type="button">Sort: A to Z</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <ul id="list"></ul>

  <div class="empty" id="empty">
    <b>No students found</b>
    <span id="empty-msg">Try a different spelling or fewer letters.</span><br>
    <button type="button" id="reset">Reset search</button>
  </div>
</main>

<script>
/* ---------- data ---------- */
const STUDENTS = [
  ['Sabhyata Chhetri','S-1001','Design'],
  ['Vision Parajuli','S-1002','Computer Science'],
  ['Prashna Rai','S-1003','Architecture'],
  ['Bhumika Adikari','S-1004','Design'],
  ['Sanjita Tamang','S-1005','Economics'],
  ['Kusum Ale Magar','S-1006','Architecture'],
  ['Ritu Moktan','S-1007','Design'],
  ['Anusha Ghimre','S-1008','Economics'],
  ['Yogesh Khanal','S-1009','Computer Science'],
  ['Raman Parajuli','S-1010','Computer Science']
].map(([name, roll, program]) => ({ name, roll, program }));

const app = document.querySelector('#app');
const box = document.querySelector('#box');
const search = document.querySelector('#search');
const list = document.querySelector('#list');
const tabs = document.querySelector('#tabs');
const status = document.querySelector('#status');
const empty = document.querySelector('#empty');
let program = 'All';
let asc = true;

/* ---------- helpers ---------- */
const escapeHTML = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// wrap every search word found in `text` with <mark>
function highlight(text, words) {
  const safe = escapeHTML(text);
  if (!words.length) return safe;
  const re = new RegExp('(' + words.map(escapeRegex).join('|') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

/* ---------- build rows once with createElement ---------- */
function buildRows() {
  const sorted = [...STUDENTS].sort((a, b) => asc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  list.replaceChildren(...sorted.map(s => {
    const li = document.createElement('li');
    li.className = 'student pop';
    li.dataset.name = s.name;
    li.dataset.roll = s.roll;
    li.dataset.program = s.program;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = s.name.split(' ').map(w => w[0]).slice(0, 2).join('');

    const info = document.createElement('div');
    const n = document.createElement('span'); n.className = 'name'; n.textContent = s.name;
    const r = document.createElement('span'); r.className = 'roll'; r.textContent = s.roll;
    info.append(n, r);

    const p = document.createElement('div');
    p.className = 'program';
    p.textContent = s.program;

    li.append(av, info, p);
    return li;
  }));
}

/* ---------- the filter ---------- */
function filter(term) {
  const words = term.split(/\s+/).filter(Boolean);          // "sab chh" -> ["sab","chh"]
  const rows = document.querySelectorAll('.student');
  let shown = 0;

  rows.forEach(row => {
    const name = row.dataset.name;
    const roll = row.dataset.roll;
    const hay = (name + ' ' + roll).toLowerCase();

    const matchesText = words.every(w => hay.includes(w));   // every word must match
    const matchesProgram = program === 'All' || row.dataset.program === program;
    const visible = matchesText && matchesProgram;

    row.style.display = visible ? '' : 'none';
    if (visible) {
      shown++;
      // BONUS: highlight the match (content is our own and escaped first)
      row.querySelector('.name').innerHTML = highlight(name, words);
      row.querySelector('.roll').innerHTML = highlight(roll, words);
    }
  });

  empty.style.display = shown ? 'none' : 'block';
  document.querySelector('#empty-msg').textContent = program !== 'All' && !words.length
    ? 'No students in this program yet.'
    : 'Try a different spelling or fewer letters.';
  box.classList.toggle('has-text', term.length > 0);
  status.textContent = words.length || program !== 'All'
    ? `Showing ${shown} of ${STUDENTS.length} students`
    : `${STUDENTS.length} students`;
}

/* ---------- events ---------- */
search.addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  filter(term);
});

const clearSearch = () => { search.value = ''; filter(''); search.focus(); };
document.querySelector('#clear').addEventListener('click', clearSearch);
document.querySelector('#reset').addEventListener('click', () => { setProgram('All'); clearSearch(); });

// program tabs
const programs = ['All', ...new Set(STUDENTS.map(s => s.program))];
programs.forEach(p => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab' + (p === 'All' ? ' on' : '');
  b.textContent = p;
  b.dataset.program = p;
  tabs.appendChild(b);
});
function setProgram(p) {
  program = p;
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.program === p));
  filter(search.value.toLowerCase());
}
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) setProgram(b.dataset.program);
});

// sort
document.querySelector('#sort').addEventListener('click', e => {
  asc = !asc;
  e.target.textContent = asc ? 'Sort: A to Z' : 'Sort: Z to A';
  buildRows();
  filter(search.value.toLowerCase());
  document.querySelectorAll('.student').forEach(r => r.classList.remove('pop'));
});

// keyboard: "/" focuses the search, Esc clears it
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  if (e.key === 'Escape' && document.activeElement === search) { search.value ? clearSearch() : search.blur(); }
});

// dark mode
const themeBtn = document.querySelector('#theme');
function setTheme(dark) {
  app.classList.toggle('dark', dark);
  try { localStorage.setItem('dir-dark', app.classList.contains('dark') ? '1' : '0'); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(!app.classList.contains('dark')));

/* ---------- init ---------- */
buildRows();
try { setTheme(localStorage.getItem('dir-dark') === '1'); } catch (e) {}
filter('');
</script>
</body>
</html>
</html>
