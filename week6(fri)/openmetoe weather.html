<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroCast // Open-Meteo Weather</title>
  <style>
    /*
      AeroCast as a kid's 그림일기 (picture diary) page: the weather is the
      drawing in the picture box, the readings go in the 원고지 squares below,
      and "Get Weather" is a round sticker you press.
    */
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

    :root {
      --ground: #26406a;
      --paper: #fffdf8;
      --ink: #22324f;
      --ink-soft: #55607a;
      --crayon-red: #c2383f;
      --sky: #d9ebff;
      --grid: #3f8a68;
      --sticker: #ffd66b;
      /* Names the weather script's inline styles use. */
      --text-muted: #55607a;
      --accent-cyan: #1d6a85;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-hand: "Gaegu", "Gowun Dodum", sans-serif;
      --font-body: "Gowun Dodum", system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3.5rem 1rem 6.5rem;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--ink);
      background:
        radial-gradient(60rem 30rem at 50% -10%, #3a5b8f, transparent 70%),
        var(--ground);
    }

    :focus-visible { outline: 3px solid var(--sticker); outline-offset: 3px; }

    /* ---------- the diary page ---------- */

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding: 3rem 2.5rem 2.25rem;
      background: var(--paper);
      border-radius: 6px;
      box-shadow: 0 2px 3px rgb(0 0 0 / 0.25), 0 30px 50px -24px rgb(0 0 0 / 0.7);
      transform: rotate(-0.6deg);
    }

    /* The spiral binding along the top edge. */
    .binding {
      position: absolute;
      top: -0.9rem;
      left: 1.5rem;
      right: 1.5rem;
      height: 2rem;
      background:
        radial-gradient(circle at 50% 70%, var(--ground) 0 0.3rem, transparent 0.32rem) 0 0 / 1.6rem 100%,
        radial-gradient(ellipse 0.35rem 0.95rem at 50% 50%, transparent 0 0.22rem, #c9ced8 0.24rem 0.34rem, transparent 0.36rem) 0 0 / 1.6rem 100%;
      pointer-events: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--ink);
    }

    .header-bar > div { display: grid; justify-items: start; gap: 0.6rem; }

    /* "Live Telemetry" pressed on like a teacher's rubber stamp. */
    .tagline {
      display: inline-block;
      padding: 0.15rem 0.6rem 0.2rem;
      font-family: var(--font-hand);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--crayon-red);
      border: 2px solid currentColor;
      border-radius: 0.35rem;
      transform: rotate(-4deg);
    }

    h1 {
      font-family: var(--font-hand);
      font-size: clamp(2.6rem, 9vw, 3.4rem);
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
    }

    .weather-sun {
      flex: none;
      width: 4.25rem;
      height: auto;
      transform: rotate(8deg);
    }

    /* ---------- city + sticker button ---------- */

    .controls-deck {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.25rem;
      margin-bottom: 2rem;
    }

    .city-select {
      flex: 1;
      min-width: 12rem;
      padding: 0.45rem 2rem 0.45rem 0.25rem;
      font-family: var(--font-hand);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--ink);
      background:
        linear-gradient(45deg, transparent 50%, var(--ink) 50%) right 0.85rem center / 0.45rem 0.45rem no-repeat,
        linear-gradient(-45deg, transparent 50%, var(--ink) 50%) right 0.4rem center / 0.45rem 0.45rem no-repeat;
      border: 0;
      border-bottom: 2px dashed var(--ink-soft);
      border-radius: 0;
      appearance: none;
      cursor: pointer;
    }
    .city-select:focus-visible { outline-offset: 4px; border-bottom-color: var(--ink); }
    .city-select option { font-family: var(--font-body); font-size: 1rem; }

    .btn-fetch {
      display: inline-grid;
      place-items: center;
      min-width: 8.5rem;
      min-height: 3.25rem;
      padding: 0.6rem 1.4rem;
      font-family: var(--font-hand);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--sticker);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 0 0 4px #fff, 0 4px 0 4px rgb(34 50 79 / 0.18);
      transform: rotate(3deg);
      cursor: pointer;
      transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }
    .btn-fetch:hover:not(:disabled) { transform: rotate(0deg) translateY(-2px); }
    .btn-fetch:active:not(:disabled) { transform: rotate(0deg) translateY(2px); box-shadow: 0 0 0 4px #fff, 0 1px 0 4px rgb(34 50 79 / 0.18); }
    .btn-fetch:disabled { cursor: progress; background: #ffe7a6; }
    .btn-fetch:focus-visible { outline-color: var(--ink); outline-offset: 7px; }

    /* ---------- the picture box and the readings ---------- */

    .weather-card { display: grid; gap: 1.5rem; }

    .primary-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 1.75rem;
      background: var(--sky);
      border: 3px solid var(--ink);
      border-radius: 4px 10px 6px 12px;
    }

    .primary-display .tagline { transform: rotate(-3deg); background: var(--paper); }

    .temp-large {
      font-family: var(--font-hand);
      font-size: 4.75rem;
      font-weight: 700;
      line-height: 0.95;
      color: var(--ink);
    }
    .temp-unit { font-size: 2rem; color: var(--crayon-red); }

    .condition-desc {
      margin-top: 0.4rem;
      font-family: "Nanum Pen Script", var(--font-hand);
      font-size: 1.9rem;
      line-height: 1;
      color: var(--ink);
    }

    .weather-icon-bubble {
      display: grid;
      place-items: center;
      width: 6rem;
      height: 6rem;
      font-size: 3.6rem;
      line-height: 1;
      background: var(--paper);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink);
      transform: rotate(-6deg);
    }

    /* Four 원고지 squares. */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 2px solid var(--grid);
      border-left: 2px solid var(--grid);
    }

    .metric-cell {
      padding: 0.85rem 1rem 0.9rem;
      border-right: 2px solid var(--grid);
      border-bottom: 2px solid var(--grid);
    }

    .metric-label { font-size: 0.875rem; color: var(--ink-soft); }

    .metric-val {
      margin-top: 0.2rem;
      font-family: var(--font-hand);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
    }

    .status-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem 1rem;
      font-family: "Nanum Pen Script", var(--font-hand);
      font-size: 1.35rem;
      color: var(--ink-soft);
    }

    /* ---------- waiting, loading and error ---------- */

    .status-panel {
      display: grid;
      justify-items: center;
      gap: 0.85rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      font-size: 1.0625rem;
      color: var(--ink-soft);
      border: 2px dashed #b9c3d6;
      border-radius: 8px;
    }

    .status-globe { font-size: 2.5rem; line-height: 1; }

    /* The script writes the error colour inline; darken it to read on paper. */
    .status-panel[style] { color: var(--crayon-red) !important; border-color: currentColor; }

    /* A little crayon sun turning while the forecast loads. */
    .spinner {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: radial-gradient(circle, #f6b31b 0 42%, transparent 44%);
      border: 4px dotted #f6b31b;
      animation: spin 1.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding-top: 2.5rem; }
      .container { padding: 2.5rem 1.15rem 1.5rem; transform: none; }
      .weather-sun { width: 3.25rem; }
      .primary-display { padding: 1.1rem; }
      .temp-large { font-size: 3.6rem; }
      .weather-icon-bubble { width: 4.5rem; height: 4.5rem; font-size: 2.6rem; }
      .metric-cell { padding: 0.7rem 0.65rem; }
      .metric-val { font-size: 1.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 6s; }
      .btn-fetch { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>

  <main class="container">
    <span class="binding" aria-hidden="true"></span>
    <div class="header-bar">
      <div>
        <div class="tagline">Live Telemetry</div>
        <h1>AeroCast</h1>
      </div>
      <svg class="weather-sun" viewBox="0 0 80 80" aria-hidden="true" focusable="false">
        <g stroke="#f6b31b" stroke-width="5" stroke-linecap="round">
          <path d="M40 6v10M40 64v10M6 40h10M64 40h10M16 16l7 7M57 57l7 7M16 64l7-7M57 23l7-7"/>
        </g>
        <circle cx="40" cy="40" r="17" fill="#ffd66b" stroke="#22324f" stroke-width="3"/>
        <path d="M33 38q2-3 4 0M43 38q2-3 4 0M34 46q6 5 12 0" fill="none" stroke="#22324f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="controls-deck">
      <select id="citySelect" class="city-select" aria-label="City">
        <option value="37.5665,126.9780,Seoul,Asia/Seoul">Seoul, KR</option>
        <option value="37.3595,127.1054,Seongnam,Asia/Seoul">Seongnam, KR</option>
        <option value="35.6895,139.6917,Tokyo,Asia/Tokyo">Tokyo, JP</option>
        <option value="40.7128,-74.0060,New York,America/New_York">New York, US</option>
        <option value="51.5074,-0.1278,London,Europe/London">London, UK</option>
        <option value="27.7172,85.3240,Kathmandu,Asia/Kathmandu">Kathmandu, NP</option>
      </select>
      <button id="fetchBtn" class="btn-fetch" onclick="getWeather()">
        <span>Get Weather</span>
      </button>
    </div>

    <div id="weather" aria-live="polite">
      <div class="status-panel">
        <span class="status-globe" aria-hidden="true">🌍</span>
        <p>Select a location and click "Get Weather" to read meteorological metrics.</p>
      </div>
    </div>
  </main>

  <script>
    const weatherCodes = {
      0: { text: "Clear Sky", icon: "☀️" },
      1: { text: "Mainly Clear", icon: "🌤️" },
      2: { text: "Partly Cloudy", icon: "⛅" },
      3: { text: "Overcast", icon: "☁️" },
      45: { text: "Fog", icon: "🌫️" },
      48: { text: "Depositing Rime Fog", icon: "🌫️" },
      51: { text: "Light Drizzle", icon: "🌦️" },
      53: { text: "Moderate Drizzle", icon: "🌦️" },
      55: { text: "Dense Drizzle", icon: "🌧️" },
      61: { text: "Slight Rain", icon: "🌧️" },
      63: { text: "Moderate Rain", icon: "🌧️" },
      65: { text: "Heavy Rain", icon: "🌧️" },
      71: { text: "Slight Snow", icon: "🌨️" },
      73: { text: "Moderate Snow", icon: "🌨️" },
      75: { text: "Heavy Snow", icon: "❄️" },
      80: { text: "Slight Showers", icon: "🌦️" },
      81: { text: "Moderate Showers", icon: "🌧️" },
      82: { text: "Violent Showers", icon: "⛈️" },
      95: { text: "Thunderstorm", icon: "⛈️" }
    };

    let controller = null;

    async function getWeather() {
      const output = document.getElementById("weather");
      const btn = document.getElementById("fetchBtn");
      const cityData = document.getElementById("citySelect").value.split(",");
      const [lat, lon, cityName, timezone] = cityData;

      if (controller) controller.abort();
      controller = new AbortController();

      btn.disabled = true;
      btn.innerHTML = `<span>Updating…</span>`;
      output.innerHTML = `
        <div class="status-panel">
          <div class="spinner"></div>
          <p>Requesting observation data for ${escapeHtml(cityName)}…</p>
        </div>
      `;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,apparent_temperature&timezone=${encodeURIComponent(timezone)}`;
        const response = await fetch(url, { signal: controller.signal });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const current = data.current;
        const condition = weatherCodes[current.weather_code] || { text: "Fair Weather", icon: "🌤️" };

        output.innerHTML = `
          <div class="weather-card">
            <div class="primary-display">
              <div>
                <div class="tagline" style="margin-bottom:0.6rem;">${escapeHtml(cityName)}</div>
                <div class="temp-large">${Math.round(current.temperature_2m)}<span class="temp-unit">°C</span></div>
                <div class="condition-desc">${escapeHtml(condition.text)}</div>
              </div>
              <div class="weather-icon-bubble">${condition.icon}</div>
            </div>

            <div class="metrics-grid">
              <div class="metric-cell">
                <div class="metric-label">Relative Humidity</div>
                <div class="metric-val">${current.relative_humidity_2m}%</div>
              </div>
              <div class="metric-cell">
                <div class="metric-label">Wind Velocity</div>
                <div class="metric-val">${current.wind_speed_10m} <span style="font-size:0.9rem; color:var(--text-muted);">km/h</span></div>
              </div>
              <div class="metric-cell">
                <div class="metric-label">Thermal Sensation</div>
                <div class="metric-val">${Math.round(current.apparent_temperature)}°C</div>
              </div>
              <div class="metric-cell">
                <div class="metric-label">Wind Direction / Code</div>
                <div class="metric-val">Code ${current.weather_code}</div>
              </div>
            </div>

            <div class="status-footer">
              <span>Timestamp: ${escapeHtml(current.time.replace("T", " "))}</span>
              <span style="font-family: var(--font-mono); color: var(--accent-cyan); font-size: 0.78rem;">LIVE LINK ACTIVE</span>
            </div>
          </div>
        `;
      } catch (error) {
        if (error.name === "AbortError") return;
        output.innerHTML = `
          <div class="status-panel" style="color: #f43f5e;">
            <span style="font-size: 2.5rem;">⚠️</span>
            <p>Connection Error: ${escapeHtml(error.message)}</p>
          </div>
        `;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Get Weather</span>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Auto-trigger on page load
    getWeather();
  </script>
</body>
</html>
