<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repos</title>
  <style>
    /*
      A post office's wall of pigeonholes. You fill in a slip with a GitHub
      username, stamp it, and each repo that comes back is filed as a label
      in its own wooden cubby.
    */
    @font-face { font-family: "Gaegu"; font-weight: 700; font-display: swap; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); }
    @font-face { font-family: "Gowun Dodum"; font-weight: 400; font-display: swap; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); }
    @font-face { font-family: "Nanum Pen Script"; font-weight: 400; font-display: swap; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); }

    :root {
      --wall: #1d4038;
      --wall-deep: #15302a;
      --wood: #8a5a3b;
      --wood-light: #a8744f;
      --wood-dark: #5a3823;
      --recess: #2e1c12;
      --brass: #d7b46a;
      --paper: #fbf6ea;
      --paper-ink: #2b2622;
      --paper-soft: #5c5249;
      --link: #1f3d7a;
      --stamp: #c0283c;
      --error: #a3201a;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html { background: var(--wall-deep); }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem 1rem 6rem;
      font-family: "Gowun Dodum", system-ui, sans-serif;
      color: var(--paper-ink);
      background:
        linear-gradient(transparent 82%, rgb(0 0 0 / 0.18) 82% 83%, transparent 83%) 0 0 / 100% 9rem,
        linear-gradient(var(--wall), var(--wall-deep));
    }

    :focus-visible { outline: 3px solid #ffd66b; outline-offset: 3px; }

    main {
      width: min(100%, 54rem);
      margin: 0 auto;
      display: grid;
      gap: 1.5rem;
    }

    /* The brass plaque over the pigeonholes. */
    h1 {
      justify-self: center;
      margin: 0;
      padding: 0.5rem 1.6rem 0.6rem;
      font-family: "Gaegu", cursive;
      font-weight: 700;
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      line-height: 1.1;
      color: #2e2210;
      background: linear-gradient(#f0d995, var(--brass) 50%, #b48d42);
      border-radius: 0.35rem;
      box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.35), 0 4px 8px rgb(0 0 0 / 0.4);
    }

    /* ---------- the counter slip ---------- */

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem;
      margin: 0;
      justify-self: center;
      width: min(100%, 34rem);
      padding: 1.2rem 1.3rem 1.3rem;
      background: var(--paper);
      border-radius: 0.2rem;
      box-shadow: 0 2px 3px rgb(0 0 0 / 0.3), 0 16px 24px -14px rgb(0 0 0 / 0.7);
      transform: rotate(-0.8deg);
    }

    input {
      flex: 1 1 13rem;
      min-width: 0;
      min-height: 2.75rem;
      padding: 0.4rem 0.2rem 0.2rem;
      font-family: "Nanum Pen Script", cursive;
      font-size: 1.75rem;
      line-height: 1.2;
      color: #1f3d7a;
      background: transparent;
      border: 0;
      border-bottom: 2px dashed #a69a88;
      border-radius: 0;
    }
    input:focus-visible { outline: none; border-bottom: 2px solid #1f3d7a; }

    /* "Load repos" as a rubber stamp. */
    button {
      flex: none;
      min-height: 2.75rem;
      padding: 0.45rem 1rem;
      font-family: "Gaegu", cursive;
      font-weight: 700;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--stamp);
      background: transparent;
      border: 2.5px solid currentColor;
      border-radius: 0.35rem;
      box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3.5px currentColor;
      transform: rotate(-3deg);
      cursor: pointer;
      transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out);
    }
    button:hover:not(:disabled) { background: #fbe4e6; }
    button:active:not(:disabled) { transform: rotate(-3deg) scale(0.94); }
    button:disabled { opacity: 0.55; cursor: wait; }

    #status {
      min-height: 1.4em;
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      color: #e8f1ec;
    }
    #status.error {
      justify-self: center;
      padding: 0.3rem 0.8rem;
      color: var(--error);
      background: #fff6c9;
      border-radius: 0.2rem;
      font-weight: 700;
    }

    /* ---------- the pigeonholes ---------- */

    ul {
      list-style: none;
      margin: 0;
      padding: 0.8rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
      gap: 0.8rem;
      background:
        linear-gradient(90deg, rgb(255 255 255 / 0.06), transparent 30% 70%, rgb(0 0 0 / 0.08)),
        var(--wood);
      border-radius: 0.5rem;
      box-shadow: inset 0 0 0 0.3rem var(--wood-light), 0 24px 40px -20px rgb(0 0 0 / 0.75);
      counter-reset: cubby;
    }
    ul:empty { display: none; }

    /* Each cubby: a dark recess with a paper label tucked inside. */
    li {
      position: relative;
      display: grid;
      align-content: start;
      gap: 0.4rem;
      padding: 1.6rem 0.65rem 2.2rem;
      background: var(--recess);
      border-radius: 0.2rem;
      box-shadow: inset 0 8px 10px rgb(0 0 0 / 0.55);
      counter-increment: cubby;
    }

    li a,
    li .meta {
      position: relative;
      z-index: 1;
      padding-inline: 0.9rem;
    }

    /* The label card sits behind the link and its details. */
    li::before {
      content: "";
      position: absolute;
      inset: 0.8rem 0.65rem 1.6rem;
      background: var(--paper);
      border-radius: 0.15rem;
      box-shadow: 0 3px 5px rgb(0 0 0 / 0.45);
      transform: rotate(var(--tilt, -0.8deg));
      transition: transform 300ms var(--ease-out);
    }
    li:nth-child(even) { --tilt: 0.9deg; }
    li:hover::before { transform: rotate(0deg) translateY(-3px); }

    /* The cubby's brass number plate. */
    li::after {
      content: counter(cubby, decimal-leading-zero);
      position: absolute;
      left: 50%;
      bottom: 0.3rem;
      padding: 0 0.45rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.2rem;
      color: #2e2210;
      background: var(--brass);
      border-radius: 0.15rem;
      transform: translateX(-50%);
    }

    a {
      font-family: "Gaegu", cursive;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.15;
      color: var(--link);
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--stamp); }

    .meta {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--paper-soft);
      overflow-wrap: anywhere;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
  <main>
    <h1>💻 GitHub Repos</h1>
    <form class="row" id="form">
      <input id="input" value="sabhyatachhetri45-dev" aria-label="GitHub username" required>
      <button type="submit">Load repos</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="list"></ul>
  </main>

  <script>
    const form = document.getElementById("form");
    const statusEl = document.getElementById("status");
    const list = document.getElementById("list");
    const button = form.querySelector("button");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    async function loadRepos(user) {
      button.disabled = true;
      setStatus("Loading repositories…");
      try {
        const res = await fetch(
          `https://api.github.com/users/${encodeURIComponent(user)}/repos?sort=updated&per_page=8`
        );
        // Give specific messages for the common failures
        if (res.status === 404) throw new Error(`User “${user}” not found`);
        if (res.status === 403) throw new Error("GitHub rate limit reached (about 60 requests/hour). Try again later.");
        if (!res.ok) throw new Error(`Request failed (${res.status})`);

        const repos = await res.json();
        if (repos.length === 0) {
          list.replaceChildren();
          setStatus("This user has no public repositories.");
          return;
        }

        list.replaceChildren(...repos.map(repo => {
          const li = document.createElement("li");

          const link = document.createElement("a");
          link.href = repo.html_url;
          link.textContent = repo.name;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent =
            `${repo.description ?? "No description"} · ${repo.language ?? "n/a"} · ★ ${repo.stargazers_count} · updated ${new Date(repo.updated_at).toLocaleDateString()}`;

          li.append(link, meta);
          return li;
        }));
        setStatus(`Showing ${repos.length} most recently updated repos.`);
      } catch (err) {
        list.replaceChildren();
        setStatus(`Error: ${err.message}`, true);
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      loadRepos(document.getElementById("input").value.trim());
    });
    form.requestSubmit();
  </script>
</body>
</html>
