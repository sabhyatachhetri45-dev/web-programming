<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoinPulse // CoinGecko API</title>
  <style>
    /*
      CryptoPulse as an old train-station split-flap board: every coin is a
      row of flaps, prices clack in letter by letter, and Refresh is the
      station master's brass button.
    */
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }

    :root {
      --ground: #1f4a44;
      --tile-wall: #23544d;
      --frame: #6b4a2f;
      --board: #232327;
      --flap: #3a3a41;
      --flap-ink: #f4efe2;
      --amber: #ffd66b;
      --enamel: #f4f1e8;
      --enamel-ink: #1d2f5a;
      --up: #8ce8bf;
      --down: #ffa3a3;
      /* Names the price script's inline styles use. */
      --text-muted: #c4bfb2;
      --danger: #ffa3a3;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-hand: "Gaegu", "Gowun Dodum", sans-serif;
      --font-body: "Gowun Dodum", system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4rem 1rem 6.5rem;
      font-family: var(--font-body);
      color: var(--flap-ink);
      background:
        radial-gradient(50rem 22rem at 50% 0%, rgb(255 214 107 / 0.16), transparent 70%),
        linear-gradient(transparent 62%, rgb(0 0 0 / 0.18) 62% 63%, transparent 63%) 0 0 / 100% 5.5rem,
        var(--ground);
    }

    :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

    /* ---------- the board in its wooden frame ---------- */

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding: 1.5rem 1.5rem 1.75rem;
      background: var(--board);
      border: 0.75rem solid var(--frame);
      border-radius: 0.6rem;
      box-shadow:
        inset 0 0 0 2px #000,
        inset 0 10px 18px rgb(0 0 0 / 0.5),
        0 2px 3px rgb(0 0 0 / 0.35),
        0 30px 50px -24px rgb(0 0 0 / 0.8);
    }

    /* Two chains the board hangs from. */
    .container::before,
    .container::after {
      content: "";
      position: absolute;
      top: -4.25rem;
      width: 0.35rem;
      height: 3.5rem;
      background: repeating-linear-gradient(#9aa0a6 0 0.45rem, #5d6268 0.45rem 0.6rem);
      border-radius: 0.2rem;
    }
    .container::before { left: 18%; }
    .container::after { right: 18%; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid #000;
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.06);
    }

    .top-bar > div { display: grid; justify-items: start; gap: 0.5rem; }

    /* "Real-Time Market Ticker" as an enamel platform sign. */
    .tagline {
      padding: 0.25rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--enamel-ink);
      background: var(--enamel);
      border-radius: 0.3rem;
      box-shadow: inset 0 0 0 2px var(--enamel), inset 0 0 0 3px var(--enamel-ink);
    }

    h1 {
      font-family: var(--font-hand);
      font-size: clamp(2.2rem, 8vw, 2.9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--amber);
    }

    /* The station master's brass push button. */
    #refreshBtn {
      min-height: 3rem;
      padding: 0.6rem 1.4rem;
      font-family: var(--font-hand);
      font-size: 1.3rem;
      font-weight: 700;
      color: #2b1d08;
      background: radial-gradient(circle at 35% 30%, #fff0c2, #e2b44f 45%, #a87a22);
      border: 2px solid #5c3f0c;
      border-radius: 999px;
      box-shadow: 0 4px 0 #5c3f0c, 0 8px 12px rgb(0 0 0 / 0.4);
      cursor: pointer;
      transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    #refreshBtn:hover:not(:disabled) { transform: translateY(-1px); }
    #refreshBtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #5c3f0c, 0 3px 6px rgb(0 0 0 / 0.4); }
    #refreshBtn:disabled { cursor: progress; filter: saturate(0.6); }

    /* ---------- one row of flaps per coin ---------- */

    .crypto-list { display: grid; min-height: 12rem; }
    .crypto-item:last-child { border-bottom: 0; box-shadow: none; }

    .crypto-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem 1rem;
      padding: 0.85rem 0.35rem;
      border-bottom: 2px solid #000;
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.06);
      animation: clack 520ms steps(4, end) both;
    }
    .crypto-item:nth-child(2) { animation-delay: 80ms; }
    .crypto-item:nth-child(3) { animation-delay: 160ms; }
    .crypto-item:nth-child(4) { animation-delay: 240ms; }
    .crypto-item:nth-child(5) { animation-delay: 320ms; }

    /* The flaps flip down into place. */
    @keyframes clack {
      from { transform: perspective(30rem) rotateX(-80deg); opacity: 0.3; }
      to { transform: none; opacity: 1; }
    }

    /*
      Each character gets its own flap tile: the tile is exactly one monospace
      character wide plus the letter-spacing, with a dark split across the middle.
    */
    .coin-name,
    .coin-price {
      --gap: 0.32em;
      display: inline-block;
      padding: 0.15em 0 0.15em calc(var(--gap) / 2);
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: var(--gap);
      line-height: 1.25;
      color: var(--flap-ink);
      background:
        linear-gradient(#0c0c0e, #0c0c0e) 0 50% / 100% 1px no-repeat,
        linear-gradient(90deg, var(--flap) calc(100% - 3px), transparent 0) 0 0 / calc(1ch + var(--gap)) 100%;
      border-radius: 2px;
      /* The last letter's spacing would start a half flap; trim it off. */
      clip-path: inset(0 calc(var(--gap) / 2) 0 0);
    }

    .coin-name { font-size: 1.05rem; text-transform: uppercase; }
    .coin-price { font-size: 1.2rem; color: var(--amber); }

    .crypto-item > div:last-child { display: grid; justify-items: end; gap: 0.35rem; }

    .change-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.15rem 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 999px;
      background: #111114;
    }
    /* A small signal lamp before the percentage. */
    .change-badge::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .change-up { color: var(--up); }
    .change-down { color: var(--down); }

    .status-box {
      padding: 2.5rem 1rem;
      text-align: center;
      font-size: 1.0625rem;
      color: var(--text-muted);
    }


    @media (max-width: 480px) {
      .container { padding: 1.1rem 0.85rem 1.25rem; border-width: 0.55rem; }
      .coin-name { font-size: 0.95rem; }
      .coin-price { font-size: 1rem; --gap: 0.22em; }
      .crypto-item > div:last-child { justify-items: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .crypto-item { animation: none; }
      #refreshBtn { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="tagline">Real-Time Market Ticker</div>
        <h1>CryptoPulse</h1>
      </div>
      <button id="refreshBtn" onclick="fetchPrices()">Refresh</button>
    </div>
    <div id="cryptoContainer" class="crypto-list" aria-live="polite"></div>
  </div>

  <script>
    const coins = ["bitcoin", "ethereum", "solana", "ripple", "cardano"];

    async function fetchPrices() {
      const container = document.getElementById('cryptoContainer');
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(',')}&vs_currencies=usd&include_24hr_change=true`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not reach CoinGecko");
        const data = await res.json();

        container.replaceChildren();

        coins.forEach(coin => {
          if (!data[coin]) return;
          const price = data[coin].usd.toLocaleString(undefined, { minimumFractionDigits: 2 });
          const change = data[coin].usd_24h_change || 0;
          const isUp = change >= 0;

          const item = document.createElement('div');
          item.className = 'crypto-item';
          item.innerHTML = `
            <div>
              <div class="coin-name">${coin}</div>
              <div style="font-size:0.8rem; color:var(--text-muted); font-family:var(--font-mono);">USD pair</div>
            </div>
            <div style="text-align: right;">
              <div class="coin-price">$${price}</div>
              <span class="change-badge ${isUp ? 'change-up' : 'change-down'}">
                ${isUp ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}%
              </span>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        container.innerHTML = `<div class="status-box" style="color:var(--danger);"><p>⚠️ ${err.message}</p></div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Refresh";
      }
    }
    fetchPrices();
  </script>
</body>
</html>
