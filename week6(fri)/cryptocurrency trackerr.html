<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoinPulse // CoinGecko API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030d12;
      --card-bg: rgba(6, 24, 30, 0.72);
      --card-border: rgba(45, 212, 191, 0.16);
      --accent: #10b981;
      --accent-cyan: #2dd4bf;
      --danger: #f43f5e;
      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
      --font-display: 'Bricolage Grotesque', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 2.25rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .tagline {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    h1 { font-family: var(--font-display); font-size: 2.2rem; }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      color: #031412;
      font-family: var(--font-display);
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.4rem;
      cursor: pointer;
    }
    .crypto-list { display: flex; flex-direction: column; gap: 0.85rem; }
    .crypto-item {
      background: rgba(3, 16, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .coin-name { font-weight: 700; font-size: 1.1rem; text-transform: capitalize; }
    .coin-price { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 600; }
    .change-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
    }
    .change-up { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
    .change-down { background: rgba(244, 63, 94, 0.15); color: var(--danger); }
    .status-box { text-align: center; padding: 2.5rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="tagline">Real-Time Market Ticker</div>
        <h1>CryptoPulse</h1>
      </div>
      <button id="refreshBtn" onclick="fetchPrices()">Refresh</button>
    </div>
    <div id="cryptoContainer" class="crypto-list" aria-live="polite"></div>
  </div>

  <script>
    const coins = ["bitcoin", "ethereum", "solana", "ripple", "cardano"];

    async function fetchPrices() {
      const container = document.getElementById('cryptoContainer');
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(',')}&vs_currencies=usd&include_24hr_change=true`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not reach CoinGecko");
        const data = await res.json();

        container.replaceChildren();

        coins.forEach(coin => {
          if (!data[coin]) return;
          const price = data[coin].usd.toLocaleString(undefined, { minimumFractionDigits: 2 });
          const change = data[coin].usd_24h_change || 0;
          const isUp = change >= 0;

          const item = document.createElement('div');
          item.className = 'crypto-item';
          item.innerHTML = `
            <div>
              <div class="coin-name">${coin}</div>
              <div style="font-size:0.8rem; color:var(--text-muted); font-family:var(--font-mono);">USD pair</div>
            </div>
            <div style="text-align: right;">
              <div class="coin-price">$${price}</div>
              <span class="change-badge ${isUp ? 'change-up' : 'change-down'}">
                ${isUp ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}%
              </span>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        container.innerHTML = `<div class="status-box" style="color:var(--danger);"><p>⚠️ ${err.message}</p></div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Refresh";
      }
    }
    fetchPrices();
  </script>
</body>
</html>
