<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobePulse // Multi-Domain Country Intelligence</title>
  <style>
    /*
      GlobePulse as an open passport on a leather desk: the navy data band at
      the top, coloured index tabs for the four categories, and every country
      as an ink visa stamp on the patterned page.
    */
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

    :root {
      --ground: #4a2131;
      --cover: #1f2f55;
      --gold: #e8c870;
      --page: #eef3ea;
      --page-ink: #23282f;
      --page-soft: #4f5862;
      --ink-navy: #23407a;
      --ink-red: #a3263a;
      --ink-green: #2c6b3e;
      --ink-purple: #5f3a96;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-hand: "Gaegu", "Gowun Dodum", sans-serif;
      --font-body: "Gowun Dodum", system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1rem 6.5rem;
      font-family: var(--font-body);
      color: var(--page-ink);
      background:
        radial-gradient(48rem 28rem at 30% 10%, #5e2b3f, transparent 70%),
        var(--ground);
    }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    /* ---------- the passport ---------- */

    .container {
      position: relative;
      width: 100%;
      max-width: 760px;
      padding: 0 1.75rem 1.75rem;
      /* Fine security-print waves over the pale green page. */
      background:
        radial-gradient(circle at 50% 120%, transparent 30%, rgb(35 64 122 / 0.05) 30.5% 31%, transparent 31.5%) 0 0 / 2.4rem 1.6rem,
        radial-gradient(circle at 50% -20%, transparent 30%, rgb(44 107 62 / 0.05) 30.5% 31%, transparent 31.5%) 1.2rem 0.8rem / 2.4rem 1.6rem,
        var(--page);
      border-radius: 0.5rem 1rem 1rem 0.5rem;
      box-shadow:
        -0.6rem 0 0 var(--cover),
        -0.6rem 0.35rem 0 #17223f,
        0 2px 3px rgb(0 0 0 / 0.3),
        0 30px 50px -24px rgb(0 0 0 / 0.8);
    }

    /* The navy data band with the title in gold foil. */
    .top-bar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 0 -1.75rem 1.5rem;
      padding: 1.6rem 1.75rem 1.4rem;
      color: var(--gold);
      background: var(--cover);
      border-radius: 0 1rem 0 0;
    }

    .tagline {
      font-size: 0.8125rem;
      letter-spacing: 0.03em;
      color: var(--gold);
    }

    h1 {
      margin-top: 0.25rem;
      font-family: var(--font-hand);
      font-size: clamp(2.3rem, 8vw, 2.9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--gold);
    }

    .emblem { flex: none; width: 4rem; height: 4rem; }

    /* ---------- index tabs ---------- */

    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tab-btn {
      min-height: 2.75rem;
      padding: 0.55rem 0.5rem 0.5rem;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      color: var(--page-ink);
      background: var(--tab, #fff);
      border: 2px solid rgb(35 40 47 / 0.25);
      border-bottom-width: 4px;
      border-radius: 0.6rem 0.6rem 0.3rem 0.3rem;
      cursor: pointer;
      transition: transform 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .tab-btn:nth-child(1) { --tab: #ffd9e1; }
    .tab-btn:nth-child(2) { --tab: #fff0c2; }
    .tab-btn:nth-child(3) { --tab: #d6e8ff; }
    .tab-btn:nth-child(4) { --tab: #d3f1df; }
    .tab-btn:hover { transform: translateY(-2px); }
    .tab-btn.active {
      font-weight: 700;
      border-color: var(--page-ink);
      transform: translateY(-4px);
      box-shadow: 0 4px 0 -1px rgb(35 40 47 / 0.25);
    }
    .tab-btn:focus-visible { outline-color: var(--cover); }

    /* ---------- search: written in pen on the page ---------- */

    .search-row { margin-bottom: 1.25rem; }

    .search-input {
      width: 100%;
      padding: 0.5rem 0.25rem;
      font-family: "Nanum Pen Script", var(--font-hand);
      font-size: 1.6rem;
      color: var(--ink-navy);
      background: transparent;
      border: 0;
      border-bottom: 2px dashed var(--page-soft);
      border-radius: 0;
    }
    .search-input::placeholder { color: var(--page-soft); opacity: 1; }
    .search-input:focus-visible { outline-offset: 4px; outline-color: var(--cover); border-bottom-color: var(--cover); }

    /* ---------- visa stamps ---------- */

    .country-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
      max-height: 480px;
      overflow-y: auto;
      padding: 0.6rem 0.6rem 0.6rem 0.25rem;
      scrollbar-color: rgb(35 64 122 / 0.35) transparent;
    }

    .country-card {
      --stamp: var(--ink-navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem 1rem;
      padding: 0.9rem 1.1rem;
      color: var(--page-ink);
      border: 2.5px solid var(--stamp);
      border-radius: 0.9rem;
      outline: 1px solid var(--stamp);
      outline-offset: -7px;
      transform: rotate(var(--tilt, -0.6deg));
      transition: transform 260ms var(--ease-out);
    }
    .country-card:nth-child(4n + 2) { --stamp: var(--ink-red); --tilt: 0.7deg; }
    .country-card:nth-child(4n + 3) { --stamp: var(--ink-green); --tilt: -0.3deg; }
    .country-card:nth-child(4n) { --stamp: var(--ink-purple); --tilt: 0.4deg; }
    .country-card:hover { transform: rotate(0deg); }

    .country-header { display: flex; align-items: center; gap: 0.85rem; }
    .country-flag { font-size: 2rem; line-height: 1; }
    .country-name { font-family: var(--font-hand); font-size: 1.45rem; font-weight: 700; line-height: 1.1; color: var(--stamp); }
    .country-meta { margin-top: 0.15rem; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--page-soft); }

    .domain-stats { display: grid; justify-items: end; gap: 0.35rem; text-align: right; }
    .primary-metric { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; color: var(--page-ink); }
    .badges-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.35rem; }

    .metric-badge {
      padding: 0.1rem 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      border: 1.5px solid currentColor;
      border-radius: 0.25rem;
    }
    .badge-cyan { color: #11636a; }
    .badge-blue { color: var(--ink-navy); }
    .badge-green { color: var(--ink-green); }
    .badge-purple { color: var(--ink-purple); }

    .status-box {
      padding: 2.5rem 1rem;
      text-align: center;
      font-family: "Nanum Pen Script", var(--font-hand);
      font-size: 1.6rem;
      color: var(--page-soft);
    }

    @media (max-width: 600px) {
      .container { padding: 0 1rem 1.25rem; }
      .top-bar { margin: 0 -1rem 1.25rem; padding: 1.3rem 1rem 1.15rem; }
      .emblem { width: 3rem; height: 3rem; }
      .search-input { font-size: 1.3rem; }
      .tabs-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .country-card { flex-direction: column; align-items: flex-start; }
      .domain-stats { justify-items: start; text-align: left; }
      .badges-row { justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab-btn, .country-card { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="tagline">Global Macro Data & Indicators</div>
        <h1>GlobePulse</h1>
      </div>
      <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <g fill="none" stroke="#e8c870" stroke-width="2.5">
          <circle cx="32" cy="32" r="22"/>
          <ellipse cx="32" cy="32" rx="9" ry="22"/>
          <path d="M10 32h44M14 21h36M14 43h36"/>
        </g>
      </svg>
    </div>

    <!-- Multi-Domain Switching -->
    <div class="tabs-nav" role="tablist">
      <button class="tab-btn active" onclick="switchCategory('demographics')">👥 Demographics</button>
      <button class="tab-btn" onclick="switchCategory('economics')">📈 Economics</button>
      <button class="tab-btn" onclick="switchCategory('tech')">⚡ Tech & Web</button>
      <button class="tab-btn" onclick="switchCategory('energy')">🌱 Eco & Energy</button>
    </div>

    <div class="search-row">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Filter by country, capital, or currency..."
        aria-label="Filter by country, capital, or currency"
        oninput="handleSearch()"
      />
    </div>

    <div id="countriesContainer" class="country-list" aria-live="polite"></div>
  </div>

  <script>
    // Comprehensive Global Country Data across 4 Domains
    const globalCountries = [
      {
        name: "United States", code: "USA", flag: "🇺🇸", capital: "Washington, D.C.", region: "Americas",
        demographics: { population: 334914895, density: 36, medianAge: 38.5, urbanPct: "83%" },
        economics: { gdp: "$27.36 T", perCapita: "$81,695", currency: "USD ($)" },
        tech: { internetPenetration: "93.4%", mobilePer100: "110", rAndDShare: "3.4% GDP" },
        energy: { co2PerCap: "14.4 t", renewableShare: "22.5%" }
      },
      {
        name: "South Korea", code: "KOR", flag: "🇰🇷", capital: "Seoul", region: "East Asia",
        demographics: { population: 51741963, density: 516, medianAge: 44.8, urbanPct: "81%" },
        economics: { gdp: "$1.71 T", perCapita: "$33,147", currency: "KRW (₩)" },
        tech: { internetPenetration: "97.6%", mobilePer100: "142", rAndDShare: "4.9% GDP" },
        energy: { co2PerCap: "11.6 t", renewableShare: "9.2%" }
      },
      {
        name: "India", code: "IND", flag: "🇮🇳", capital: "New Delhi", region: "South Asia",
        demographics: { population: 1428627663, density: 435, medianAge: 28.7, urbanPct: "36%" },
        economics: { gdp: "$3.73 T", perCapita: "$2,612", currency: "INR (₹)" },
        tech: { internetPenetration: "52.4%", mobilePer100: "84", rAndDShare: "0.7% GDP" },
        energy: { co2PerCap: "2.0 t", renewableShare: "21.4%" }
      },
      {
        name: "Germany", code: "DEU", flag: "🇩🇪", capital: "Berlin", region: "Europe",
        demographics: { population: 84482267, density: 236, medianAge: 45.7, urbanPct: "77%" },
        economics: { gdp: "$4.46 T", perCapita: "$52,824", currency: "EUR (€)" },
        tech: { internetPenetration: "94.0%", mobilePer100: "128", rAndDShare: "3.1% GDP" },
        energy: { co2PerCap: "7.7 t", renewableShare: "51.8%" }
      },
      {
        name: "Japan", code: "JPN", flag: "🇯🇵", capital: "Tokyo", region: "East Asia",
        demographics: { population: 124516650, density: 330, medianAge: 48.6, urbanPct: "92%" },
        economics: { gdp: "$4.21 T", perCapita: "$33,806", currency: "JPY (¥)" },
        tech: { internetPenetration: "93.3%", mobilePer100: "155", rAndDShare: "3.3% GDP" },
        energy: { co2PerCap: "8.1 t", renewableShare: "22.7%" }
      },
      {
        name: "Nepal", code: "NPL", flag: "🇳🇵", capital: "Kathmandu", region: "South Asia",
        demographics: { population: 30547580, density: 207, medianAge: 25.3, urbanPct: "22%" },
        economics: { gdp: "$40.8 B", perCapita: "$1,336", currency: "NPR (₨)" },
        tech: { internetPenetration: "49.6%", mobilePer100: "125", rAndDShare: "0.3% GDP" },
        energy: { co2PerCap: "0.5 t", renewableShare: "94.2%" }
      },
      {
        name: "Brazil", code: "BRA", flag: "🇧🇷", capital: "Brasília", region: "Americas",
        demographics: { population: 216422446, density: 25, medianAge: 33.5, urbanPct: "87%" },
        economics: { gdp: "$2.17 T", perCapita: "$10,043", currency: "BRL (R$)" },
        tech: { internetPenetration: "84.3%", mobilePer100: "105", rAndDShare: "1.2% GDP" },
        energy: { co2PerCap: "2.1 t", renewableShare: "83.0%" }
      },
      {
        name: "United Kingdom", code: "GBR", flag: "🇬🇧", capital: "London", region: "Europe",
        demographics: { population: 67736802, density: 279, medianAge: 40.6, urbanPct: "84%" },
        economics: { gdp: "$3.33 T", perCapita: "$49,150", currency: "GBP (£)" },
        tech: { internetPenetration: "97.0%", mobilePer100: "119", rAndDShare: "2.9% GDP" },
        energy: { co2PerCap: "4.7 t", renewableShare: "44.0%" }
      }
    ];

    let activeCategory = 'demographics';

    function switchCategory(category) {
      activeCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(category));
      });
      renderList(getFilteredData());
    }

    function getFilteredData() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return globalCountries;
      return globalCountries.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.capital.toLowerCase().includes(q) ||
        c.region.toLowerCase().includes(q) ||
        c.economics.currency.toLowerCase().includes(q)
      );
    }

    function handleSearch() {
      renderList(getFilteredData());
    }

    function renderList(countries) {
      const container = document.getElementById('countriesContainer');
      container.replaceChildren();

      if (!countries || countries.length === 0) {
        container.innerHTML = `<div class="status-box"><p>No country records match your filter.</p></div>`;
        return;
      }

      countries.forEach(c => {
        const card = document.createElement('div');
        card.className = 'country-card';

        let statsHTML = '';

        if (activeCategory === 'demographics') {
          statsHTML = `
            <div class="primary-metric">👥 ${c.demographics.population.toLocaleString()}</div>
            <div class="badges-row">
              <span class="metric-badge badge-cyan">${c.demographics.density}/km²</span>
              <span class="metric-badge badge-blue">Age ${c.demographics.medianAge}</span>
              <span class="metric-badge badge-green">Urban ${c.demographics.urbanPct}</span>
            </div>
          `;
        } else if (activeCategory === 'economics') {
          statsHTML = `
            <div class="primary-metric">💰 ${c.economics.gdp}</div>
            <div class="badges-row">
              <span class="metric-badge badge-green">${c.economics.perCapita} / cap</span>
              <span class="metric-badge badge-cyan">${c.economics.currency}</span>
            </div>
          `;
        } else if (activeCategory === 'tech') {
          statsHTML = `
            <div class="primary-metric">🌐 ${c.tech.internetPenetration} Online</div>
            <div class="badges-row">
              <span class="metric-badge badge-blue">${c.tech.mobilePer100} Mob/100</span>
              <span class="metric-badge badge-purple">${c.tech.rAndDShare} R&D</span>
            </div>
          `;
        } else if (activeCategory === 'energy') {
          statsHTML = `
            <div class="primary-metric">⚡ ${c.energy.renewableShare} Clean</div>
            <div class="badges-row">
              <span class="metric-badge badge-purple">CO₂ ${c.energy.co2PerCap}</span>
              <span class="metric-badge badge-green">Renewables</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="country-header">
            <div class="country-flag">${c.flag}</div>
            <div>
              <div class="country-name">${c.name}</div>
              <div class="country-meta">${c.capital} • ${c.region}</div>
            </div>
          </div>
          <div class="domain-stats">
            ${statsHTML}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initial render
    renderList(globalCountries);
  </script>
</body>
</html>
