<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Dog</title>
  <style>
    /*
      A pastel instant camera. "Get a dog" is the shutter; the dog from the API
      comes out of the slot as an instant print.
    */
    @font-face { font-family: "Gaegu"; font-weight: 700; font-display: swap; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); }
    @font-face { font-family: "Gowun Dodum"; font-weight: 400; font-display: swap; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); }

    :root {
      --ground: #a84a2e;
      --ground-deep: #8a3a22;
      --body: #c6ead9;
      --body-dark: #95cdb4;
      --body-ink: #1f3a30;
      --trim: #fffaf2;
      --lens: #2a2d36;
      --shutter: #e0485e;
      --error: #9b1c1c;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { background: var(--ground-deep); }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem 1rem 6rem;
      font-family: "Gowun Dodum", system-ui, sans-serif;
      color: var(--body-ink);
      background:
        radial-gradient(ellipse 55% 40% at 50% 28%, rgb(255 220 180 / 0.22), transparent 70%),
        linear-gradient(var(--ground), var(--ground-deep));
    }

    :focus-visible { outline: 3px solid #fff3b0; outline-offset: 3px; }

    /* ---------- the camera ---------- */

    main {
      width: min(100%, 30rem);
      margin: 0 auto;
    }

    .camera {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 0.9rem;
      padding: 1.4rem 1.25rem 1.6rem;
      border-radius: 2.2rem 2.2rem 1.6rem 1.6rem;
      background:
        linear-gradient(to top, rgb(30 80 60 / 0.16), transparent 2.5rem),
        linear-gradient(90deg, rgb(255 255 255 / 0.25), transparent 20% 80%, rgb(0 0 0 / 0.06)),
        var(--body);
      box-shadow: 0 30px 40px -22px rgb(40 10 0 / 0.75);
    }

    /* Top row: viewfinder, flash, and the camera's name plate. */
    .camera__top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .viewfinder {
      width: 3.2rem;
      height: 2.2rem;
      border-radius: 0.6rem;
      background: radial-gradient(circle at 40% 35%, #6d7385, var(--lens) 70%);
      box-shadow: 0 0 0 0.3rem var(--trim);
    }
    .flash {
      width: 4.2rem;
      height: 2.2rem;
      border-radius: 0.5rem;
      background: repeating-linear-gradient(90deg, #fffef7 0 4px, #e9e4d8 4px 6px);
      box-shadow: 0 0 0 0.3rem var(--trim);
    }

    h1 {
      margin: 0;
      font-family: "Gaegu", cursive;
      font-weight: 700;
      font-size: clamp(1.9rem, 7vw, 2.4rem);
      line-height: 1.1;
      text-align: center;
      color: var(--body-ink);
    }

    .lens {
      justify-self: center;
      width: min(62%, 11rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 34%, rgb(255 255 255 / 0.55) 0 7%, transparent 8%),
        radial-gradient(circle, #3d4a6b 0 28%, #1a1c24 30% 52%, #4a4f5c 54% 58%, #22252e 60% 100%);
      box-shadow: 0 0 0 0.6rem var(--trim), 0 0 0 0.9rem var(--body-dark), 0 6px 10px 0.9rem rgb(0 0 0 / 0.12);
      margin-block: 0.6rem 0.4rem;
    }
    .camera:has(#dog-btn:disabled) .lens { animation: focus 0.6s ease-in-out infinite alternate; }
    @keyframes focus { to { transform: scale(0.96) rotate(20deg); } }

    /* Controls: the breed choice is a label-maker strip, "Get a dog" is the shutter. */
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0;
    }

    select {
      flex: 1 1 12rem;
      min-height: 3rem;
      padding: 0.6rem 2.4rem 0.6rem 0.9rem;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.03em;
      color: #f4f4f6;
      background:
        linear-gradient(45deg, transparent 50%, #f4f4f6 50%) right 1.15rem center / 0.45rem 0.45rem no-repeat,
        linear-gradient(-45deg, transparent 50%, #f4f4f6 50%) right 0.8rem center / 0.45rem 0.45rem no-repeat,
        #2a2d36;
      border: 0;
      border-radius: 0.35rem;
      box-shadow: 0 2px 0 #14161c;
      appearance: none;
      cursor: pointer;
    }
    select option { color: #1d2433; background: #fff; }

    #dog-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 5.6rem;
      aspect-ratio: 1;
      padding: 0.5rem;
      font-family: "Gaegu", cursive;
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1;
      color: #fff;
      background: radial-gradient(circle at 38% 30%, #e5566a, #c8364c 60%, #a8253b);
      border: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0.35rem var(--trim), 0 6px 0 0.35rem var(--body-dark);
      cursor: pointer;
      transition: transform 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
    }
    #dog-btn:hover:not(:disabled) { transform: translateY(-1px); }
    #dog-btn:active:not(:disabled),
    #dog-btn:disabled { transform: translateY(4px); box-shadow: 0 0 0 0.35rem var(--trim), 0 2px 0 0.35rem var(--body-dark); }
    #dog-btn:disabled { cursor: wait; }

    #status {
      min-height: 1.5em;
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      color: var(--body-ink);
    }
    #status.error { color: var(--error); font-weight: 700; }

    /* The slot the print comes out of. */
    .camera::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 0.15rem;
      height: 0.45rem;
      border-radius: 0.3rem;
      background: #3a5a4c;
    }

    /* ---------- the instant print ---------- */

    .print {
      position: relative;
      z-index: 1;
      width: min(86%, 22rem);
      margin: -0.4rem auto 0;
      padding: 0.85rem 0.85rem 3.2rem;
      background: #fffdf8;
      border-radius: 0.2rem;
      box-shadow: 0 2px 3px rgb(0 0 0 / 0.25), 0 20px 30px -16px rgb(40 10 0 / 0.7);
      transform: rotate(-1.5deg);
      transform-origin: top center;
    }
    .print.eject { animation: eject 900ms var(--ease-out); }
    @keyframes eject { from { transform: translateY(-70%) rotate(0deg); } }

    /* Until the first picture arrives, the print is still "developing". */
    .print:has(#dog-img[hidden])::before {
      content: "";
      display: block;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #2f3540, #4a4f5c);
      border-radius: 0.1rem;
    }

    #dog-img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.1rem;
      margin: 0;
      max-height: none;
    }
    #dog-img[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>
  <main>
    <div class="camera">
      <div class="camera__top" aria-hidden="true"><span class="viewfinder"></span><span class="flash"></span></div>
      <h1>🐶 Random Dog</h1>
      <span class="lens" aria-hidden="true"></span>
      <div class="row">
        <select id="breed" aria-label="Dog breed"><option value="">Any breed</option></select>
        <button id="dog-btn" type="button">Get a dog</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <figure class="print">
      <img id="dog-img" alt="" hidden>
    </figure>
  </main>

  <script>
    const btn = document.getElementById("dog-btn");
    const img = document.getElementById("dog-img");
    const statusEl = document.getElementById("status");
    const breedSelect = document.getElementById("breed");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return res.json();
    }

    // Fill the dropdown from the API
    async function loadBreeds() {
      try {
        const { message } = await getJSON("https://dog.ceo/api/breeds/list/all");
        const options = [];
        for (const [breed, subs] of Object.entries(message)) {
          if (subs.length === 0) options.push(new Option(breed, breed));
          else subs.forEach(sub => options.push(new Option(`${sub} ${breed}`, `${breed}/${sub}`)));
        }
        breedSelect.append(...options);
      } catch { /* optional: random dogs still work without the list */ }
    }

    async function getDog() {
      btn.disabled = true;
      setStatus("Fetching a good boy…");
      try {
        const breed = breedSelect.value;
        const url = breed
          ? `https://dog.ceo/api/breed/${breed}/images/random`
          : "https://dog.ceo/api/breeds/image/random";
        const { message: imageUrl } = await getJSON(url);

        // wait until the image has really loaded before showing it
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Image failed to load"));
          img.src = imageUrl;
        });
        img.alt = breed ? `A random ${breed.replace("/", " ")} dog` : "A random dog";
        img.hidden = false;
        setStatus("");
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", getDog);

    // Decoration only: each new picture slides out of the camera like a fresh print.
    img.addEventListener("load", () => {
      const print = img.closest(".print");
      print.classList.remove("eject");
      void print.offsetWidth;
      print.classList.add("eject");
    });
    loadBreeds();
    getDog();
  </script>
</body>
</html>
