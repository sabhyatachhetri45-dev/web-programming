<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Dog</title>
  <style>
    :root { --bg: #f4f6f8; --card: #fff; --text: #1d2433; --muted: #5d677a; --accent: #3156a5; --accent-text: #fff; --border: #dde2ea; --error: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151c; --card: #1b2030; --text: #e6e9f0; --muted: #98a2b8; --accent: #6f93e6; --accent-text: #0e1320; --border: #2c3348; --error: #ff8a80; }
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; }
    main { max-width: 700px; margin: 0 auto; background: var(--card); padding: 24px; border-radius: 12px; }
    h1 { margin-top: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    select { flex: 1 1 200px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font-size: 1rem; }
    button { padding: 10px 15px; cursor: pointer; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; font-size: 1rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #status { color: var(--muted); min-height: 1.4em; }
    #status.error { color: var(--error); }
    #dog-img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>🐶 Random Dog</h1>
    <div class="row">
      <select id="breed" aria-label="Dog breed"><option value="">Any breed</option></select>
      <button id="dog-btn" type="button">Get a dog</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <img id="dog-img" alt="" hidden>
  </main>

  <script>
    const btn = document.getElementById("dog-btn");
    const img = document.getElementById("dog-img");
    const statusEl = document.getElementById("status");
    const breedSelect = document.getElementById("breed");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return res.json();
    }

    // Fill the dropdown from the API
    async function loadBreeds() {
      try {
        const { message } = await getJSON("https://dog.ceo/api/breeds/list/all");
        const options = [];
        for (const [breed, subs] of Object.entries(message)) {
          if (subs.length === 0) options.push(new Option(breed, breed));
          else subs.forEach(sub => options.push(new Option(`${sub} ${breed}`, `${breed}/${sub}`)));
        }
        breedSelect.append(...options);
      } catch { /* optional: random dogs still work without the list */ }
    }

    async function getDog() {
      btn.disabled = true;
      setStatus("Fetching a good boy…");
      try {
        const breed = breedSelect.value;
        const url = breed
          ? `https://dog.ceo/api/breed/${breed}/images/random`
          : "https://dog.ceo/api/breeds/image/random";
        const { message: imageUrl } = await getJSON(url);

        // wait until the image has really loaded before showing it
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Image failed to load"));
          img.src = imageUrl;
        });
        img.alt = breed ? `A random ${breed.replace("/", " ")} dog` : "A random dog";
        img.hidden = false;
        setStatus("");
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", getDog);
    loadBreeds();
    getDog();
  </script>
</body>
</html>
