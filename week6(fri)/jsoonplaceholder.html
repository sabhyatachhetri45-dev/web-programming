<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAPI // Emerald Dark Edition</title>
  <style>
    /*
      Data Stream Explorer as a red 우체통 (postbox) on a corkboard wall:
      the header is the postbox with its slot, the controls are its white
      collection-times plate, every fetched post is a letter pinned to the
      cork, and its comments come out as little yellow replies.
    */
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

    :root {
      --cork: #8d5d3b;
      --postbox: #c0303a;
      --postbox-dark: #8e1f28;
      --plate: #f7f4ec;
      --letter: #fffdf6;
      --letter-line: #cfdcef;
      --ink: #2a2522;
      --ink-soft: #5a524c;
      --reply: #fff1a8;
      /* Names the script's inline styles use. */
      --accent-rose: #a3263a;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-hand: "Gaegu", "Gowun Dodum", sans-serif;
      --font-body: "Gowun Dodum", system-ui, sans-serif;
      --radius: 0.5rem;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 6.5rem;
      font-family: var(--font-body);
      font-size: 17px;
      color: var(--ink);
      /* Cork: a few scattered darker and lighter grains. */
      background:
        radial-gradient(circle at 20% 30%, rgb(60 35 20 / 0.35) 0 1px, transparent 1.6px) 0 0 / 13px 11px,
        radial-gradient(circle at 70% 60%, rgb(255 220 170 / 0.18) 0 1px, transparent 1.8px) 0 0 / 17px 19px,
        var(--cork);
    }

    :focus-visible { outline: 3px solid #ffe08a; outline-offset: 3px; }

    .app-wrapper {
      width: 100%;
      max-width: 960px;
      display: grid;
      gap: 2rem;
    }

    /* ---------- the postbox ---------- */

    .header-bento {
      position: relative;
      justify-self: center;
      width: min(100%, 44rem);
      padding: 3.6rem 2.5rem 2.25rem;
      color: #fff;
      background: linear-gradient(90deg, var(--postbox-dark), var(--postbox) 18%, var(--postbox) 82%, var(--postbox-dark));
      border-radius: 2.5rem 2.5rem 0.75rem 0.75rem;
      box-shadow: inset 0 -6px 0 rgb(0 0 0 / 0.18), 0 2px 3px rgb(0 0 0 / 0.3), 0 26px 40px -22px rgb(0 0 0 / 0.7);
    }

    /* The letter slot. */
    .header-bento::before {
      content: "";
      position: absolute;
      top: 1.35rem;
      left: 50%;
      width: 11rem;
      height: 0.9rem;
      margin-left: -5.5rem;
      background: #3a0d12;
      border-radius: 0.5rem;
      box-shadow: inset 0 3px 4px rgb(0 0 0 / 0.6), 0 2px 0 rgb(255 255 255 / 0.25);
    }

    .tagline {
      margin-bottom: 0.75rem;
      font-size: 0.9375rem;
      letter-spacing: 0.03em;
      color: #ffe6e6;
    }

    .header-bento h1 {
      margin-bottom: 0.85rem;
      font-family: var(--font-hand);
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 700;
      line-height: 1.05;
      color: #fff;
    }

    .header-bento p {
      max-width: 36rem;
      font-size: 1.0625rem;
      line-height: 1.7;
      color: #fff0f0;
    }

    /* ---------- the collection-times plate ---------- */

    .control-deck {
      position: relative;
      justify-self: center;
      width: min(100%, 44rem);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 0.75rem 1rem;
      margin-top: -1rem;
      padding: 1rem 1.5rem;
      background: var(--plate);
      border-radius: 0.5rem;
      box-shadow: inset 0 0 0 2px var(--plate), inset 0 0 0 3px #b7ab95, 0 10px 18px -10px rgb(0 0 0 / 0.6);
    }

    /* Two screws holding the plate on. */
    .control-deck::before,
    .control-deck::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0.55rem;
      height: 0.55rem;
      margin-top: -0.275rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e6e1d6, #8f8677);
    }
    .control-deck::before { left: 0.45rem; }
    .control-deck::after { right: 0.45rem; }

    .filter-input,
    .select-limit {
      min-height: 2.75rem;
      padding: 0.4rem 0.25rem;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 2px dashed #8a8073;
      border-radius: 0;
    }
    .filter-input::placeholder { color: var(--ink-soft); opacity: 1; }
    .select-limit { padding-right: 0.5rem; font-family: var(--font-mono); cursor: pointer; }
    .filter-input:focus-visible,
    .select-limit:focus-visible { outline-color: var(--postbox); border-bottom-color: var(--ink); }

    .btn-fire {
      min-height: 2.75rem;
      padding: 0.5rem 1.3rem;
      font-family: var(--font-hand);
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      background: var(--postbox);
      border: 2px solid var(--postbox-dark);
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--postbox-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    .btn-fire:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-fire:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--postbox-dark); }
    .btn-fire:disabled { cursor: progress; background: #d9737a; border-color: #a4434b; }
    .btn-fire:focus-visible { outline-color: var(--ink); }

    /* ---------- letters pinned to the cork ---------- */

    .posts-stream {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2.25rem 1.75rem;
      padding-top: 0.5rem;
    }

    @media (min-width: 760px) {
      .posts-stream { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .posts-stream > .status-stage { grid-column: 1 / -1; }
    }

    .post-panel {
      position: relative;
      align-self: start;
      padding: 2rem 1.6rem 1.5rem;
      background:
        repeating-linear-gradient(transparent 0 calc(1.75rem - 1px), var(--letter-line) calc(1.75rem - 1px) 1.75rem) 0 4.2rem / 100% calc(100% - 4.2rem) no-repeat,
        var(--letter);
      border-radius: 3px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 16px 24px -14px rgb(0 0 0 / 0.65);
      transform: rotate(var(--tilt, -0.8deg));
      transition: transform 320ms var(--ease-out);
    }
    .post-panel:nth-child(3n + 2) { --tilt: 0.9deg; }
    .post-panel:nth-child(3n) { --tilt: -0.3deg; }
    .post-panel:hover { transform: rotate(0deg); }

    /* The push pin. */
    .post-panel::before {
      content: "";
      position: absolute;
      top: -0.55rem;
      left: 50%;
      width: 1.3rem;
      height: 1.3rem;
      margin-left: -0.65rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff9aa5, #d23b48 55%, #8e1f28);
      box-shadow: 0 3px 4px rgb(0 0 0 / 0.4);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .author-pill { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9375rem; color: var(--ink-soft); }

    .avatar-dot {
      display: grid;
      place-items: center;
      width: 2.1rem;
      height: 2.1rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      color: #041014;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--letter), 0 0 0 3px rgb(42 37 34 / 0.3);
    }

    /* The post number as a postmark. */
    .badge-index {
      padding: 0.2rem 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      color: #3d3a8a;
      border: 2px solid currentColor;
      border-radius: 999px;
      transform: rotate(-8deg);
    }

    .post-title {
      margin-bottom: 0.4rem;
      font-family: var(--font-hand);
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.75rem;
      color: var(--ink);
      text-transform: capitalize;
    }

    .post-content { font-size: 1rem; line-height: 1.75rem; color: #3a3430; }

    .comments-toggle {
      margin-top: 1.1rem;
      padding: 0.35rem 0;
      font-family: "Nanum Pen Script", var(--font-hand);
      font-size: 1.45rem;
      color: var(--accent-rose);
      background: none;
      border: 0;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .comments-toggle:disabled { cursor: progress; color: var(--ink-soft); }
    .comments-toggle:focus-visible { outline-color: var(--ink); }

    /* Replies tucked behind the letter as small yellow notes. */
    .comments-drawer {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed #b9ae9c;
    }

    .comment-bubble {
      padding: 0.8rem 0.95rem;
      background: var(--reply);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.18);
    }
    .comment-bubble:nth-child(even) { transform: rotate(0.6deg); }
    .comment-bubble:nth-child(odd) { transform: rotate(-0.5deg); }

    .comment-sender {
      margin-bottom: 0.25rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      color: #5b4a12;
      overflow-wrap: anywhere;
    }

    .comment-text { font-size: 0.9375rem; line-height: 1.55; color: var(--ink); }

    /* ---------- idle, loading and error: an envelope on the cork ---------- */

    .status-stage {
      display: grid;
      justify-items: center;
      gap: 1rem;
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--ink-soft);
      background:
        linear-gradient(var(--letter), var(--letter)) padding-box,
        repeating-linear-gradient(-45deg, #d64550 0 14px, var(--letter) 14px 20px, #2f5aa8 20px 34px, var(--letter) 34px 40px) border-box;
      border: 0.45rem solid transparent;
      border-radius: 0.4rem;
      box-shadow: 0 16px 24px -14px rgb(0 0 0 / 0.65);
    }

    .status-stage h3 { margin-bottom: 0.35rem; font-family: var(--font-hand); font-size: 1.7rem; font-weight: 700; color: var(--ink); }
    .status-stage p { font-size: 1.0625rem; }
    .status-icon { font-size: 3rem; line-height: 1; }

    .pulse-ring {
      width: 3rem;
      height: 3rem;
      border: 4px solid rgb(192 48 58 / 0.2);
      border-top-color: var(--postbox);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 680px) {
      body { font-size: 16px; padding: 2rem 1rem 6.5rem; }
      .header-bento { padding: 3.2rem 1.4rem 1.75rem; border-radius: 2rem 2rem 0.6rem 0.6rem; }
      .header-bento::before { width: 8rem; margin-left: -4rem; }
      .control-deck { grid-template-columns: minmax(0, 1fr); padding: 1rem 1.4rem; }
      .post-panel { padding: 1.8rem 1.2rem 1.3rem; }
      .post-title { font-size: 1.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .post-panel, .btn-fire { transition: none; }
      .pulse-ring { animation-duration: 4s; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>
<body>

  <div class="app-wrapper">
    <header class="header-bento">
      <div class="tagline">Async Pipeline &bull; Live REST Client</div>
      <h1>Data Stream Explorer</h1>
      <p>Connect and pull asynchronous mock records directly from JSONPlaceholder with live filtering and reactive thread introspection.</p>
    </header>

    <div class="control-deck">
      <input
        type="text"
        id="filterInput"
        class="filter-input"
        placeholder="Filter loaded posts by keyword..."
        aria-label="Filter loaded posts by keyword"
        autocomplete="off"
      >
      <select id="limitSelect" class="select-limit" aria-label="Number of records">
        <option value="6">06 Records</option>
        <option value="12" selected>12 Records</option>
        <option value="24">24 Records</option>
      </select>
      <button id="triggerBtn" class="btn-fire" onclick="fetchStream()">
        <span>Fetch Records</span>
      </button>
    </div>

    <main id="streamContainer" class="posts-stream" aria-live="polite">
      <div class="status-stage">
        <div class="status-icon" aria-hidden="true">⚡</div>
        <div>
          <h3>System Idle</h3>
          <p>Click "Fetch Records" to request live placeholder payloads.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const streamContainer = document.getElementById("streamContainer");
    const triggerBtn = document.getElementById("triggerBtn");
    const limitSelect = document.getElementById("limitSelect");
    const filterInput = document.getElementById("filterInput");

    let allPosts = [];
    let abortCtrl = null;

    const userColors = [
      '#10b981', '#2dd4bf', '#f59e0b', '#06b6d4',
      '#a855f7', '#84cc16', '#34d399', '#38bdf8'
    ];

    async function fetchStream() {
      if (abortCtrl) abortCtrl.abort();
      abortCtrl = new AbortController();

      const count = limitSelect.value;
      triggerBtn.disabled = true;
      triggerBtn.innerHTML = `<span>Fetching...</span>`;

      streamContainer.innerHTML = `
        <div class="status-stage">
          <div class="pulse-ring"></div>
          <div>
            <h3>Synchronizing Payloads</h3>
            <p>Pulling ${count} records across the pipe...</p>
          </div>
        </div>
      `;

      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${count}`, {
          signal: abortCtrl.signal
        });

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        allPosts = await response.json();
        renderPosts(allPosts);

      } catch (err) {
        if (err.name === 'AbortError') return;
        streamContainer.innerHTML = `
          <div class="status-stage" style="border-color: rgba(244, 63, 94, 0.4);">
            <div class="status-icon">⚠️</div>
            <div>
              <h3 style="color: var(--accent-rose)">Payload Request Failed</h3>
              <p>${sanitize(err.message)}</p>
            </div>
          </div>
        `;
      } finally {
        triggerBtn.disabled = false;
        triggerBtn.innerHTML = `<span>Fetch Records</span>`;
      }
    }

    function renderPosts(posts) {
      streamContainer.replaceChildren();

      if (!posts.length) {
        streamContainer.innerHTML = `
          <div class="status-stage">
            <div class="status-icon" aria-hidden="true">🔍</div>
            <div>
              <h3>No Matching Records</h3>
              <p>None of the loaded posts match that keyword.</p>
            </div>
          </div>
        `;
        return;
      }

      posts.forEach((post) => {
        const panel = document.createElement('article');
        panel.className = 'post-panel';
        panel.innerHTML = `
          <div class="post-header">
            <div class="author-pill">
              <span class="avatar-dot">U${post.userId}</span>
              <span>User ${post.userId}</span>
            </div>
            <span class="badge-index">#${String(post.id).padStart(2, '0')}</span>
          </div>
          <h2 class="post-title">${sanitize(post.title)}</h2>
          <p class="post-content">${sanitize(post.body)}</p>
          <button class="comments-toggle" type="button" aria-expanded="false">View comments</button>
        `;
        // Each author keeps the same colour across posts.
        panel.querySelector('.avatar-dot').style.backgroundColor = userColors[(post.userId - 1) % userColors.length];
        const toggle = panel.querySelector('.comments-toggle');
        toggle.addEventListener('click', () => toggleComments(post.id, panel, toggle));
        streamContainer.appendChild(panel);
      });
    }

    // Comments are fetched only when asked for, then the same button hides them again.
    async function toggleComments(postId, panel, toggle) {
      const openDrawer = panel.querySelector('.comments-drawer');
      if (openDrawer) {
        openDrawer.remove();
        toggle.textContent = 'View comments';
        toggle.setAttribute('aria-expanded', 'false');
        return;
      }

      toggle.disabled = true;
      toggle.textContent = 'Loading comments...';

      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/comments`);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        const comments = await response.json();

        const drawer = document.createElement('div');
        drawer.className = 'comments-drawer';
        drawer.innerHTML = comments.map((comment) => `
          <div class="comment-bubble">
            <div class="comment-sender">${sanitize(comment.email)}</div>
            <p class="comment-text">${sanitize(comment.body)}</p>
          </div>
        `).join('');
        panel.appendChild(drawer);

        toggle.textContent = `Hide comments (${comments.length})`;
        toggle.setAttribute('aria-expanded', 'true');
      } catch (err) {
        toggle.textContent = 'Could not load comments. Try again';
      } finally {
        toggle.disabled = false;
      }
    }

    function sanitize(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Live filtering over the posts already fetched; no new request needed.
    filterInput.addEventListener('input', () => {
      if (!allPosts.length) return;
      const q = filterInput.value.toLowerCase().trim();
      renderPosts(allPosts.filter((post) =>
        post.title.toLowerCase().includes(q) || post.body.toLowerCase().includes(q)
      ));
    });
  </script>
</body>
</html>
