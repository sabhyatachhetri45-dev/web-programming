<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAPI // Emerald Dark Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #041014;
      --card-bg: rgba(7, 26, 31, 0.72);
      --card-border: rgba(45, 212, 191, 0.15);
      --accent-neon: #10b981;
      --accent-violet: #2dd4bf;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
      --font-display: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 3.5rem 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 17px;
    }

    .aurora-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.28;
      animation: float 14s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: #059669;
      top: -10%;
      left: 10%;
    }

    .blob-2 {
      width: 540px;
      height: 540px;
      background: #0d9488;
      bottom: -15%;
      right: 5%;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 400px;
      height: 400px;
      background: #d97706;
      top: 40%;
      left: 50%;
      opacity: 0.14;
      animation-delay: -9s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
    }

    .header-bento {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      border-radius: var(--radius);
      padding: 3rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .header-bento::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-violet), var(--accent-amber));
    }

    .tagline {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-neon);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
    }

    .tagline::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-neon);
    }

    .header-bento h1 {
      font-family: var(--font-display);
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #fff 30%, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .header-bento p {
      color: var(--text-muted);
      font-size: 1.2rem;
      line-height: 1.7;
      max-width: 680px;
    }

    .control-deck {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 1.15rem;
      background: rgba(6, 30, 36, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .filter-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.9rem 1.4rem;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .filter-input:focus {
      border-color: var(--accent-neon);
      background: rgba(16, 185, 129, 0.06);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .select-limit {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 1rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-limit:focus {
      border-color: var(--accent-violet);
    }

    .btn-fire {
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-violet));
      color: #031512;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 2rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-fire:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.45);
    }

    .btn-fire:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .posts-stream {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .post-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 2.25rem;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .post-panel:hover {
      border-color: rgba(45, 212, 191, 0.35);
      transform: translateY(-3px) scale(1.005);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.15rem;
    }

    .author-pill {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .avatar-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: #041014;
    }

    .badge-index {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.35rem 0.8rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(45, 212, 191, 0.25);
      color: var(--accent-violet);
      font-weight: 600;
    }

    .post-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 0.85rem;
      text-transform: capitalize;
    }

    .post-content {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.75;
    }

    .comments-toggle {
      background: transparent;
      border: none;
      color: var(--accent-neon);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      transition: color 0.2s;
    }

    .comments-toggle:hover {
      color: #6ee7b7;
      text-shadow: 0 0 10px rgba(110, 231, 183, 0.5);
    }

    .comments-drawer {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .comment-bubble {
      background: rgba(4, 16, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-neon);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
    }

    .comment-sender {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--accent-neon);
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .comment-text {
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .status-stage {
      text-align: center;
      padding: 5rem 2rem;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .status-stage h3 {
      font-size: 1.45rem;
      color: #f0fdf4;
      margin-bottom: 0.35rem;
    }

    .status-stage p {
      font-size: 1.1rem;
    }

    .status-icon {
      font-size: 3.5rem;
    }

    .pulse-ring {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--accent-neon);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      body { font-size: 16px; padding: 2rem 1rem; }
      .control-deck { grid-template-columns: 1fr; }
      .header-bento { padding: 2rem; }
      .header-bento h1 { font-size: 2.3rem; }
      .post-panel { padding: 1.5rem; }
      .post-title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <div class="aurora-mesh">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <div class="app-wrapper">
    <header class="header-bento">
      <div class="tagline">Async Pipeline &bull; Live REST Client</div>
      <h1>Data Stream Explorer</h1>
      <p>Connect and pull asynchronous mock records directly from JSONPlaceholder with live filtering and reactive thread introspection.</p>
    </header>

    <div class="control-deck">
      <input
        type="text"
        id="filterInput"
        class="filter-input"
        placeholder="Filter loaded posts by keyword..."
        autocomplete="off"
      >
      <select id="limitSelect" class="select-limit">
        <option value="6">06 Records</option>
        <option value="12" selected>12 Records</option>
        <option value="24">24 Records</option>
      </select>
      <button id="triggerBtn" class="btn-fire" onclick="fetchStream()">
        <span>Fetch Records</span>
      </button>
    </div>

    <main id="streamContainer" class="posts-stream" aria-live="polite">
      <div class="status-stage">
        <div class="status-icon">⚡</div>
        <div>
          <h3>System Idle</h3>
          <p>Click "Fetch Records" to request live placeholder payloads.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const streamContainer = document.getElementById("streamContainer");
    const triggerBtn = document.getElementById("triggerBtn");
    const limitSelect = document.getElementById("limitSelect");
    const filterInput = document.getElementById("filterInput");

    let allPosts = [];
    let abortCtrl = null;

    const userColors = [
      '#10b981', '#2dd4bf', '#f59e0b', '#06b6d4',
      '#a855f7', '#84cc16', '#34d399', '#38bdf8'
    ];

    async function fetchStream() {
      if (abortCtrl) abortCtrl.abort();
      abortCtrl = new AbortController();

      const count = limitSelect.value;
      triggerBtn.disabled = true;
      triggerBtn.innerHTML = `<span>Fetching...</span>`;

      streamContainer.innerHTML = `
        <div class="status-stage">
          <div class="pulse-ring"></div>
          <div>
            <h3>Synchronizing Payloads</h3>
            <p>Pulling ${count} records across the pipe...</p>
          </div>
        </div>
      `;

      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${count}`, {
          signal: abortCtrl.signal
        });

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        allPosts = await response.json();
        renderPosts(allPosts);

      } catch (err) {
        if (err.name === 'AbortError') return;
        streamContainer.innerHTML = `
          <div class="status-stage" style="border-color: rgba(244, 63, 94, 0.4);">
            <div class="status-icon">⚠️</div>
            <div>
              <h3 style="color: var(--accent-rose)">Payload Request Failed</h3>
              <p>${sanitize(err.message)}</p>
            </div>
          </div>
        `;
      } finally {
        triggerBtn.disabled = false;
        triggerBtn.innerHTML = `<span>Fetch Records</span>`;
      }
    }

    function renderPosts(posts) {
      streamContainer.replaceChildren();

      if (!posts.length) {
        streamContainer.innerHTML = `
          <div class="status-stage
