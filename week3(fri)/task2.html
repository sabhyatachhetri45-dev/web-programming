<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Card</title>

  <style>
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

    *, *::before, *::after { box-sizing: border-box; }

    /* A cork board in a wooden frame. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem 6rem;
      font-family: "Gowun Dodum", Arial, sans-serif;
      background-color: #c99a64;
      background-image:
        radial-gradient(#a9773f 1px, transparent 1.6px),
        radial-gradient(#dfb987 1px, transparent 1.6px),
        radial-gradient(ellipse at 30% 20%, rgba(255, 236, 200, 0.35), transparent 60%);
      background-size: 7px 7px, 11px 11px, 100% 100%;
      background-position: 0 0, 3px 5px, 0 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      border: 0.9rem solid #8a5a2b;
      box-shadow: inset 0 0 0 2px #6f451d, inset 0 6px 18px rgba(60, 30, 5, 0.45);
      pointer-events: none;
    }

    /* The pin stays in the board; only the photo lifts off it. */
    .pinned {
      position: relative;
      padding-top: 0.6rem;
    }

    .pin {
      position: absolute;
      top: -0.2rem;
      left: 50%;
      z-index: 2;
      width: 1.5rem;
      height: 1.5rem;
      margin-left: -0.75rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7ef0dc, #14b8a6 55%, #0f766e);
      box-shadow: 0 3px 4px rgba(40, 20, 5, 0.45);
    }

    /* The card is now a little instant photo. */
    .card {
      width: min(20rem, 100%);
      padding: 0.85rem 0.85rem 1.4rem;
      background-color: #fffefb;
      border-radius: 3px;
      transform: rotate(-3deg);
      box-shadow: 0 2px 3px rgba(60, 30, 5, 0.3);

      /* Transition is on the card, not hover */
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.45s ease;
    }

    .card:hover {
      /* Card moves up (off the pin) when mouse is over it */
      transform: translateY(-14px) rotate(0deg) scale(1.03);

      /* Coloured shadow appears */
      box-shadow: 0 26px 34px -12px rgba(20, 184, 166, 0.6), 0 4px 8px rgba(60, 30, 5, 0.2);
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 0.86;
      margin-bottom: 1rem;
      border-radius: 2px;
    }

    .card h2 {
      margin: 0;
      font-family: "Nanum Pen Script", cursive;
      font-weight: normal;
      font-size: 2.6rem;
      line-height: 1;
      color: #0f766e;
    }

    .card p {
      margin: 0.35rem 0 0;
      color: #4a4540;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>

<body>

  <div class="pinned">
    <span class="pin" aria-hidden="true"></span>

    <div class="card">
      <svg class="photo" viewBox="0 0 240 206" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#99f6e4"/>
            <stop offset="1" stop-color="#ccfbf1"/>
          </linearGradient>
        </defs>
        <rect width="240" height="206" fill="url(#sky)"/>
        <circle cx="176" cy="58" r="22" fill="#fef3c7"/>
        <path d="M44 62c6-10 22-10 27 0 9-2 15 8 9 14H38c-7-3-4-14 6-14Z" fill="#fff"/>
        <path d="M0 150c40-26 78-30 120-14s82 10 120-12v82H0Z" fill="#5eead4"/>
        <path d="M0 176c46-18 96-16 140-2s70 6 100-6v38H0Z" fill="#14b8a6"/>
        <path d="M0 196c60-10 130-8 240-4v14H0Z" fill="#0f766e"/>
      </svg>

      <h2>Hello!</h2>
      <p>
        Move your mouse over this card
        to see the hover effect.
      </p>
    </div>
  </div>

</body>
</html>
