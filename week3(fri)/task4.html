<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Variables Theme</title>

  <style>
    /* Main theme colors and spacing */
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #333333;
      --radius: 12px;
      --space: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: var(--space);
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background-color: var(--bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: var(--space);
      margin-bottom: var(--space);
    }

    h1 {
      color: var(--primary);
    }

    .button {
      background-color: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      cursor: pointer;
    }

    .button:hover {
      background-color: var(--accent);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5eead4;
        --accent: #14b8a6;
        --bg: #134e4a;
        --text: #f0fdfa;
        --radius: 12px;
        --space: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>My Theme Page</h1>

    <div class="card">
      <h2>Welcome!</h2>
      <p>
        This page uses CSS variables for colors,
        spacing, and border radius.
      </p>

      <button class="button">Click Me</button>
    </div>

  </div>

</body>
</html>
