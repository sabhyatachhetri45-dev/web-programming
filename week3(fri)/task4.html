<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables Theme</title>

  <style>
    @font-face { font-family: "Gaegu"; src: url("../assets/fonts/gaegu-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gowun Dodum"; src: url("../assets/fonts/gowun-dodum.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Nanum Pen Script"; src: url("../assets/fonts/nanum-pen-script.woff2") format("woff2"); font-display: swap; }

    /* Main theme colors and spacing.
       These six variables are the paints on the palette below:
       change one here and every place that uses it repaints. */
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #333333;
      --radius: 12px;
      --space: 20px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: calc(var(--space) * 2) var(--space) calc(var(--space) * 5);
      /* The desk is mixed from two of the paints. */
      background-color: color-mix(in srgb, var(--bg) 86%, var(--accent));
      color: var(--text);
      font-family: "Gowun Dodum", Arial, sans-serif;
    }

    .container {
      display: grid;
      gap: calc(var(--space) * 1.5);
      align-items: center;
      max-width: 58rem;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-family: "Gaegu", Arial, sans-serif;
      font-size: clamp(2.6rem, 7vw, 4rem);
      line-height: 1;
      color: var(--primary);
    }

    /* ---------- the palette ---------- */

    .palette {
      margin: 0;
    }

    .palette svg {
      display: block;
      width: min(100%, 24rem);
      height: auto;
      margin-inline: auto;
      transform: rotate(-6deg);
      filter: drop-shadow(0 14px 16px rgba(15, 80, 70, 0.25));
    }

    .board { fill: #fbf3e4; stroke: #e5d3b3; stroke-width: 2; }
    /* The thumb hole shows the desk through it. */
    .thumb { fill: color-mix(in srgb, var(--bg) 86%, var(--accent)); stroke: #e5d3b3; stroke-width: 1.5; }
    .well-primary { fill: var(--primary); }
    .well-accent { fill: var(--accent); }
    .well-bg { fill: var(--bg); stroke: #d9cbb0; stroke-width: 1.5; }
    .well-text { fill: var(--text); }

    /* The paint names, written on masking tape under the palette. */
    .inks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 0.75rem;
      margin: calc(var(--space) * 1.2) 0 0;
      padding: 0;
      list-style: none;
    }

    .inks li {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.7rem 0.3rem 0.4rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.8rem;
      color: #3a2f22;
      background: rgba(244, 228, 190, 0.92);
      transform: rotate(var(--tilt, -1deg));
      box-shadow: 0 1px 2px rgba(60, 40, 10, 0.15);
    }

    .inks li:nth-child(even) { --tilt: 1.5deg; }

    .dot {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    .dot-primary { background: var(--primary); }
    .dot-accent { background: var(--accent); }
    .dot-bg { background: var(--bg); }
    .dot-text { background: var(--text); }

    /* Radius and space are shown as shapes instead of colours. */
    .dot-radius {
      border: 2px solid #3a2f22;
      border-radius: 0 var(--radius) 0 0;
      border-left: 0;
      border-bottom: 0;
      box-shadow: none;
    }

    .dot-space {
      width: var(--space);
      height: 0.5rem;
      border-radius: 2px;
      background: #3a2f22;
      box-shadow: none;
    }

    /* ---------- the card, painted with the same variables ---------- */

    .card {
      position: relative;
      background-color: var(--bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: calc(var(--space) * 1.4);
      margin-bottom: var(--space);
      box-shadow: 0 18px 30px -20px color-mix(in srgb, var(--primary) 70%, transparent);
      transform: rotate(1.5deg);
    }

    .card h2 {
      display: inline-block;
      margin: 0 0 0.6rem;
      padding: 0 0.3rem;
      font-family: "Nanum Pen Script", cursive;
      font-weight: normal;
      font-size: 2.6rem;
      line-height: 1;
      color: var(--primary);
      /* A brush stroke of the accent paint behind the heading. */
      background: linear-gradient(100deg, transparent 2%, color-mix(in srgb, var(--accent) 35%, transparent) 4% 94%, transparent 97%) 0 72% / 100% 42% no-repeat;
    }

    .card p {
      margin: 0 0 calc(var(--space) * 1.2);
      line-height: 1.6;
    }

    .button {
      padding: 0.7rem 1.4rem;
      background-color: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-family: "Gaegu", Arial, sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .button:hover {
      /* The accent paint shows up as a ring around the button. */
      transform: translateY(-2px);
      box-shadow: 0 0 0 4px var(--accent);
    }

    .button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
    }

    @media (min-width: 46rem) {
      .container {
        grid-template-columns: 1fr 1fr;
      }

      h1 { grid-column: 1 / -1; }
    }

    /* Dark mode: only the variables change, the rest of the CSS stays. */
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5eead4;
        --accent: #14b8a6;
        --bg: #134e4a;
        --text: #f0fdfa;
        --radius: 12px;
        --space: 20px;
      }

      .button { color: #042f2e; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>

<body>

  <div class="container">

    <h1>My Theme Page</h1>

    <figure class="palette" aria-hidden="true">
      <svg viewBox="0 0 320 240" focusable="false">
        <path class="board" d="M40 70C62 18 150 4 224 22s92 72 72 122-82 82-150 82S8 196 12 146c3-28 30-30 48-22 18 9 34-4 26-20-9-16-52-6-46-34Z"/>
        <ellipse class="thumb" cx="62" cy="118" rx="17" ry="13"/>
        <circle class="well-primary" cx="132" cy="62" r="24"/>
        <circle class="well-accent" cx="202" cy="64" r="24"/>
        <circle class="well-bg" cx="248" cy="124" r="24"/>
        <circle class="well-text" cx="196" cy="180" r="24"/>
        <path d="M120 150c14-14 34-10 40 4s-10 26-24 22-26-12-16-26Z" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      </svg>

      <ul class="inks">
        <li><span class="dot dot-primary"></span>--primary</li>
        <li><span class="dot dot-accent"></span>--accent</li>
        <li><span class="dot dot-bg"></span>--bg</li>
        <li><span class="dot dot-text"></span>--text</li>
        <li><span class="dot dot-radius"></span>--radius</li>
        <li><span class="dot dot-space"></span>--space</li>
      </ul>
    </figure>

    <div class="card">
      <h2>Welcome!</h2>
      <p>
        This page uses CSS variables for colors,
        spacing, and border radius.
      </p>

      <button class="button">Click Me</button>
    </div>

  </div>

</body>
</html>
