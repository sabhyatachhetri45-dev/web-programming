<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Spinner</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #f0fdfa;
      background-image: radial-gradient(ellipse at 50% 40%, #ffffff 0%, transparent 65%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.25rem 6rem;
    }

    /* The loader is a cassette tape: two reels turning while the tape
       slowly winds from the left reel onto the right one. */
    .cassette {
      position: relative;
      width: min(30rem, 100%);
      aspect-ratio: 1.58;
      padding: 7% 6% 0;
      background: linear-gradient(160deg, #14857b, #115e59);
      border-radius: 1rem;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08), 0 24px 32px -18px rgba(17, 94, 89, 0.7), 0 3px 6px rgba(17, 94, 89, 0.25);
      transform: rotate(-4deg);
    }

    /* Four screws. */
    .cassette::before {
      content: "";
      position: absolute;
      inset: 0.55rem;
      background:
        radial-gradient(circle at 0.35rem 0.35rem, #8fd9cd 0 0.18rem, #0b4a46 0.2rem 0.32rem, transparent 0.34rem) top left / 0.7rem 0.7rem no-repeat,
        radial-gradient(circle at 0.35rem 0.35rem, #8fd9cd 0 0.18rem, #0b4a46 0.2rem 0.32rem, transparent 0.34rem) top right / 0.7rem 0.7rem no-repeat,
        radial-gradient(circle at 0.35rem 0.35rem, #8fd9cd 0 0.18rem, #0b4a46 0.2rem 0.32rem, transparent 0.34rem) bottom left / 0.7rem 0.7rem no-repeat,
        radial-gradient(circle at 0.35rem 0.35rem, #8fd9cd 0 0.18rem, #0b4a46 0.2rem 0.32rem, transparent 0.34rem) bottom right / 0.7rem 0.7rem no-repeat;
    }

    /* Paper label with ruled lines and a teal stripe. */
    .label {
      position: relative;
      height: 74%;
      padding: 9% 8% 0;
      background:
        linear-gradient(#5eead4, #5eead4) 0 62% / 100% 14% no-repeat,
        repeating-linear-gradient(transparent 0 13px, #e7dcc8 13px 14px) 0 0 / 100% 40% no-repeat,
        #fdf8ee;
      border-radius: 0.5rem;
    }

    /* The window the reels show through. */
    .window {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 58%;
      margin-top: 14%;
      padding: 0 9%;
      background: rgba(4, 47, 46, 0.82);
      border-radius: 999px;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .reel-slot {
      position: relative;
      display: grid;
      place-items: center;
      width: 26%;
      aspect-ratio: 1;
    }

    /* Wound tape: brown discs that grow and shrink. */
    .tape {
      position: absolute;
      width: 170%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #6b4430 0 40%, #4a2c1f 70%);
      animation: wind 9s ease-in-out infinite alternate;
    }

    .reel-slot:last-child .tape { animation-name: unwind; }

    @keyframes wind {
      from { transform: scale(1); }
      to { transform: scale(0.62); }
    }

    @keyframes unwind {
      from { transform: scale(0.62); }
      to { transform: scale(1); }
    }

    /* The original lesson: one element, a border, and a rotate animation.
       The white hub with six teeth is the "spinner" now. */
    .spinner {
      position: relative;
      width: 100%;
      aspect-ratio: 1;

      /* Circle with light teal border */
      border: 4px solid #99f6e4;

      /* Dark teal on the top */
      border-top: 4px solid #0f766e;

      border-radius: 50%;
      background: repeating-conic-gradient(#fdf8ee 0 22deg, transparent 22deg 60deg);
      -webkit-mask: radial-gradient(circle, transparent 0 32%, #000 33%);
      mask: radial-gradient(circle, transparent 0 32%, #000 33%);

      /* Run the animation forever */
      animation: spin 1.4s linear infinite;
    }

    /* Spinner rotation */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* The trapezoid at the bottom with the tape-head holes. */
    .bridge {
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: 0;
      height: 17%;
      background:
        radial-gradient(circle at 20% 55%, #0b4a46 0 0.28rem, transparent 0.3rem),
        radial-gradient(circle at 80% 55%, #0b4a46 0 0.28rem, transparent 0.3rem),
        radial-gradient(circle at 40% 60%, #0b4a46 0 0.2rem, transparent 0.22rem),
        radial-gradient(circle at 60% 60%, #0b4a46 0 0.2rem, transparent 0.22rem),
        #0f6f68;
      clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 6s; }
      .tape { animation: none; }
    }
  </style>
  <script src="../assets/drawer/tab.js" defer></script>
</head>

<body>

  <div class="cassette" role="status" aria-label="Loading">
    <div class="label">
      <div class="window">
        <div class="reel-slot">
          <span class="tape" aria-hidden="true"></span>
          <div class="spinner"></div>
        </div>
        <div class="reel-slot">
          <span class="tape" aria-hidden="true"></span>
          <div class="spinner"></div>
        </div>
      </div>
    </div>
    <span class="bridge" aria-hidden="true"></span>
  </div>

</body>
</html>
