<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the Week 8 contact and student registration form exercises.">
  <title>Week 8 | Forms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #faf8f5;
      --surface: #fff;
      --border: #e7e0d6;
      --text: #1f2937;
      --muted: #64748b;
      --accent: #c2410c;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    .crumbbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem max(1.25rem, calc((100vw - 960px) / 2));
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
    }

    .crumbbar a {
      color: var(--muted);
      text-decoration: none;
    }

    .crumbbar a:hover, .form-card:hover h2 { color: var(--accent); }

    main {
      width: min(100% - 2rem, 900px);
      margin: 0 auto;
      padding: 3.5rem 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1, h2 {
      font-family: 'Bricolage Grotesque', sans-serif;
      line-height: 1.15;
    }

    h1 {
      margin: 0.45rem 0;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
    }

    .form-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 1rem;
      margin-top: 2.25rem;
    }

    .form-card {
      display: block;
      min-height: 155px;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .form-card:hover {
      transform: translateY(-2px);
      background: #fffdfa;
      border-color: var(--accent);
    }

    .form-type {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-card h2 {
      margin: 0.55rem 0 0.35rem;
      font-size: 1.25rem;
      transition: color 0.2s ease;
    }

    .form-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <nav class="crumbbar" aria-label="Breadcrumb">
    <a href="../index.html">Web Programming</a>
    <a href="../index.html#exercisesHeader">All exercises</a>
  </nav>

  <main>
    <span class="eyebrow">Week 08</span>
    <h1>Forms</h1>
    <p class="intro">Choose a Week 8 form exercise to open.</p>

    <section class="form-list" aria-label="Week 8 form exercises">
      <a class="form-card" href="contact%20form.html">
        <span class="form-type">Contact</span>
        <h2>Contact Form</h2>
        <p>A form to say hello or start a project.</p>
      </a>
      <a class="form-card" href="student%20registration.html">
        <span class="form-type">Registration</span>
        <h2>Student Registration</h2>
        <p>A student registration form with input validation.</p>
      </a>
    </section>
  </main>
</body>
</html>
