<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Programming Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #dfeeff);
      margin: 0;
      padding: 0;
      color: #1e2a38;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #123a5a;
      margin-bottom: 20px;
    }

    p {
      text-align: center;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      text-decoration: none;
      background: #eef5ff;
      border: 1px solid #cfe0ff;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: center;
      color: #123a5a;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .card:hover {
      background: #dfeeff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Programming Tasks</h1>
    <p>Choose a task folder below:</p>

    <div class="links">
      <a class="card" href="week2%20mon/Task%202.html">Week 2 Monday</a>
      <a class="card" href="week2%20fri/task1.html">Week 2 Friday</a>
      <a class="card" href="week3(mon)/task1-heading.html">Week 3 Monday</a>
      <a class="card" href="week3(fri)/task1.html">Week 3 Friday</a>
    </div>
  </div>
</body>
</html>
